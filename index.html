<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a3222">
<!-- Vom Startbildschirm aus ohne Browserleiste starten — auf dem iPhone der
     einzige Weg zum Vollbild, weil Safari dort keine Vollbild-Schnittstelle hat. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Goldhuf">
<title>Goldhuf — Stall &amp; Sprung</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/ui.css">
<link rel="stylesheet" href="css/stall.css">
<link rel="stylesheet" href="css/pasture.css">
<link rel="stylesheet" href="css/hud.css">
</head>
<body>

<div id="app">

  <header id="topbar" class="hidden">
    <button id="btn-home" class="tb-btn" title="Zurück in den Stall">🏠 <span>Stall</span></button>
    <div class="tb-spacer"></div>
    <div id="coin-display" title="Münzen">🪙 <span id="coin-count">0</span></div>
    <button id="btn-sound" class="tb-btn" title="Ton an/aus">🔊</button>
    <button id="btn-settings" class="tb-btn" title="Einstellungen">⚙️</button>
  </header>

  <main id="screens">

    <section id="screen-title" class="screen">
      <div class="title-wrap">
        <h1 class="game-title">Goldhuf</h1>
        <p class="game-sub">Stall &amp; Sprung</p>
        <div id="title-horse" class="title-horse"></div>
        <div class="title-menu">
          <button id="btn-continue" class="btn btn-big btn-primary">Weiterspielen</button>
          <button id="btn-newgame" class="btn btn-big">Neues Spiel</button>
        </div>
        <p class="title-hint">Pflege deine Pferde, springe Parcours, sammle Münzen.</p>
      </div>
    </section>

    <section id="screen-stable" class="screen"></section>
    <section id="screen-horses" class="screen"></section>
    <section id="screen-editor" class="screen"></section>
    <section id="screen-shop"   class="screen"></section>
    <section id="screen-pasture" class="screen"></section>
    <section id="screen-levels" class="screen"></section>
    <section id="screen-result" class="screen"></section>

    <section id="screen-ride" class="screen">
      <div class="ride-wrap">
        <canvas id="ride-canvas" width="960" height="540"></canvas>

        <div id="ride-hud">
          <div class="hud-row hud-top">
            <div class="hud-chip" id="hud-level-name">Reitplatz</div>
            <div class="hud-chip hud-coins">🪙 <span id="hud-coins">0</span></div>
            <button id="hud-quit" class="hud-chip hud-btn" title="Parcours verlassen">✕</button>
          </div>

          <div class="hud-bars">
            <div class="hud-bar hud-progress">
              <div class="hud-bar-fill" id="hud-progress-fill"></div>
              <span class="hud-bar-label">Strecke</span>
              <div class="hud-marker" id="hud-marker">🐴</div>
            </div>
            <div class="hud-bar hud-stamina">
              <div class="hud-bar-fill" id="hud-stamina-fill"></div>
              <span class="hud-bar-label">Ausdauer</span>
            </div>
          </div>

          <div class="hud-help" id="hud-help">
            <kbd>Leertaste</kbd> springen (halten = höher) &nbsp;·&nbsp;
            <kbd>↓</kbd> ducken &nbsp;·&nbsp; <kbd>Umschalt</kbd> Sprint
          </div>

          <div class="hud-touch">
            <button id="hud-duck" class="hud-pad" title="Ducken">
              <span class="pad-icon">⬇</span><span>Ducken</span>
            </button>
            <button id="hud-sprint" class="hud-pad" title="Sprint">
              <span class="pad-icon">💨</span><span>Sprint</span>
            </button>
          </div>
        </div>

        <div id="ride-rotate">Dreh dein Gerät quer —<br>dann siehst du mehr von der Strecke.</div>
        <div id="ride-overlay" class="hidden"></div>
      </div>
    </section>

  </main>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
