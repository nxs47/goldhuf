<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a3222">
<!-- Vom Startbildschirm aus ohne Browserleiste starten — auf dem iPhone der
     einzige Weg zum Vollbild, weil Safari dort keine Vollbild-Schnittstelle hat. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Goldhuf">
<title>Goldhuf — Stall &amp; Sprung</title>

<style>
/* ==== css/base.css ==== */
/* base.css — Reset, Farbvariablen, Typografie, Grundlayout */

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }

:root {
  /* Holz- und Stallfarben */
  --wood-dark:  #4a3222;
  --wood:       #6b4a2f;
  --wood-light: #8b6440;
  --straw:      #e8c87a;
  --straw-soft: #f5e3b3;
  --cream:      #fdf6e6;
  --ink:        #2e2118;
  --ink-soft:   #5b4736;

  --gold:       #f2b632;
  --gold-dark:  #c98a13;
  --green:      #6aa84f;
  --green-dark: #4c7a37;
  --red:        #d1564a;
  --blue:       #5b8bb5;

  --shadow-sm: 0 2px 4px rgba(46,33,24,.18);
  --shadow:    0 4px 14px rgba(46,33,24,.22);
  --shadow-lg: 0 10px 34px rgba(46,33,24,.32);

  --radius:    14px;
  --radius-sm: 9px;

  --topbar-h: 58px;

  font-size: 16px;
}

body {
  font-family: "Segoe UI", "Trebuchet MS", system-ui, -apple-system, sans-serif;
  color: var(--ink);
  background: #241a12;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;

  /* Am Finger bedient: kein Doppeltipp-Zoom, kein Aufleuchten beim Tippen,
     kein Gummiband am Rand und keine Textauswahl beim Halten. */
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
}

/* Namen darf man natuerlich trotzdem markieren. */
input, textarea { -webkit-user-select: text; user-select: text; }

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;   /* Handy: waechst und schrumpft mit der Adressleiste */
  background:
    radial-gradient(ellipse at 50% 0%, #3d2b1c 0%, #241a12 70%);
}

#screens {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
}

.screen {
  position: absolute;
  inset: 0;
  display: none;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;   /* kein Zurueckziehen der ganzen Seite */
}
.screen.active { display: block; }

.hidden { display: none !important; }

h1, h2, h3 { margin: 0 0 .5em; line-height: 1.15; }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.15rem; }
p  { margin: 0 0 .8em; line-height: 1.5; }

kbd {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 5px;
  background: rgba(255,255,255,.18);
  border: 1px solid rgba(255,255,255,.25);
  font-family: inherit;
  font-size: .85em;
}

/* ---------- Topbar ---------- */

#topbar {
  flex: 0 0 auto;
  height: calc(var(--topbar-h) + env(safe-area-inset-top));
  padding-top: env(safe-area-inset-top);
  display: flex;
  align-items: center;
  gap: 10px;
  padding-left: max(14px, env(safe-area-inset-left));
  padding-right: max(14px, env(safe-area-inset-right));
  background: linear-gradient(#7b563a, #5c3f28);
  border-bottom: 3px solid var(--wood-dark);
  box-shadow: var(--shadow);
  z-index: 30;
}
.tb-spacer { flex: 1 1 auto; }

.tb-btn {
  min-height: 44px;   /* Daumenbreite — kleiner trifft man schlecht */
  padding: 0 14px;
  border: 2px solid rgba(0,0,0,.22);
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,.14);
  color: var(--cream);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: background .12s, transform .08s;
}
.tb-btn:active { transform: translateY(1px); }

#coin-display {
  display: flex;
  align-items: center;
  gap: 7px;
  min-height: 40px;
  padding: 0 16px;
  border-radius: 999px;
  background: linear-gradient(#ffdc84, #f2b632);
  border: 2px solid var(--gold-dark);
  color: #4a3308;
  font-weight: 800;
  font-size: 1.05rem;
  box-shadow: var(--shadow-sm);
}
#coin-display.bump { animation: coin-bump .35s ease; }
@keyframes coin-bump {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.16); }
  100% { transform: scale(1); }
}

/* ---------- Titelbildschirm ---------- */

#screen-title {
  background:
    radial-gradient(ellipse at 50% 30%, #8a6236 0%, #402c1b 60%, #241a12 100%);
}
.title-wrap {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 30px 20px;
  text-align: center;
}
.game-title {
  margin: 0;
  font-size: clamp(3rem, 11vw, 5.6rem);
  letter-spacing: .04em;
  color: var(--gold);
  text-shadow: 0 3px 0 var(--gold-dark), 0 8px 24px rgba(0,0,0,.5);
}
.game-sub {
  margin: 0 0 6px;
  font-size: clamp(1rem, 3vw, 1.5rem);
  letter-spacing: .3em;
  text-transform: uppercase;
  color: var(--straw-soft);
}
.title-horse { width: min(330px, 74vw); filter: drop-shadow(0 12px 18px rgba(0,0,0,.45)); }
.title-horse svg { width: 100%; height: auto; }
.title-menu { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
.title-hint { margin-top: 16px; color: #d8c3a4; font-size: .95rem; }

/* ---------- Buttons ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 10px 20px;
  border: 2px solid var(--wood-dark);
  border-radius: var(--radius-sm);
  background: linear-gradient(var(--straw-soft), var(--straw));
  color: var(--ink);
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: filter .12s, transform .08s;
}
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* Am Finger gibt es kein Schweben: die Effekte nur dort, wo ein Zeiger ist.
   Sonst bleibt ein getippter Knopf hinterher hell "haengen". */
@media (hover: hover) {
  .btn:hover:not(:disabled) { filter: brightness(1.07); }
  .tb-btn:hover             { background: rgba(255,255,255,.26); }
}

.btn-big     { min-height: 56px; padding: 14px 40px; font-size: 1.2rem; min-width: min(260px, 100%); }
.btn-primary { background: linear-gradient(#8fce6f, #6aa84f); border-color: var(--green-dark); color: #14260c; }
.btn-danger  { background: linear-gradient(#e8837a, #d1564a); border-color: #963a31; color: #fff; }
.btn-ghost   { background: rgba(255,255,255,.12); color: var(--cream); border-color: rgba(255,255,255,.25); box-shadow: none; }
.btn-sm      { min-height: 34px; padding: 5px 12px; font-size: .88rem; }

/* ---------- Toasts ---------- */

#toast-root {
  position: fixed;
  top: calc(var(--topbar-h) + env(safe-area-inset-top) + 12px);
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  z-index: 100;
  pointer-events: none;
}
.toast {
  padding: 10px 20px;
  border-radius: 999px;
  background: rgba(30,20,12,.93);
  color: var(--cream);
  font-weight: 600;
  box-shadow: var(--shadow);
  animation: toast-in .25s ease, toast-out .3s ease 1.9s forwards;
}
.toast.good { background: rgba(58,96,38,.95); }
.toast.bad  { background: rgba(140,45,38,.95); }
@keyframes toast-in  { from { opacity: 0; transform: translateY(-12px); } }
@keyframes toast-out { to   { opacity: 0; transform: translateY(-12px); } }

/* ---------- Scrollbars ---------- */

.screen::-webkit-scrollbar { width: 12px; }
.screen::-webkit-scrollbar-track { background: rgba(0,0,0,.2); }
.screen::-webkit-scrollbar-thumb { background: var(--wood-light); border-radius: 6px; border: 3px solid transparent; background-clip: padding-box; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
<style>
/* ==== css/ui.css ==== */
/* ui.css — Seitenlayout, Karten, Shop, Editor, Streckenwahl, Modals */

.page {
  max-width: 1180px;
  margin: 0 auto;
  padding: 22px max(20px, env(safe-area-inset-right)) max(60px, env(safe-area-inset-bottom))
           max(20px, env(safe-area-inset-left));
  color: var(--cream);
}
.page-head {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.page-head h2 { margin: 0; color: var(--straw); font-size: 1.75rem; }
.page-head .sub { color: #cbb392; font-size: .95rem; margin: 0; }
.page-head .grow { flex: 1 1 auto; }

.panel {
  background: rgba(253,246,230,.94);
  color: var(--ink);
  border: 3px solid var(--wood-dark);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
}

.grid {
  display: grid;
  gap: 16px;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
}

/* ---------- Karten ---------- */

.card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 14px;
  background: linear-gradient(var(--cream), #f3e7ce);
  border: 3px solid var(--wood);
  border-radius: var(--radius);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
  transition: transform .12s, box-shadow .12s, border-color .12s;
}
.card.clickable { cursor: pointer; }
.card.clickable:active { transform: translateY(1px); }
.card.selected { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(242,182,50,.5), var(--shadow); }
.card.locked   { opacity: .58; filter: grayscale(.55); }

.card-title { font-weight: 800; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
.card-desc  { font-size: .88rem; color: var(--ink-soft); flex: 1 1 auto; line-height: 1.4; }
.card-art   { display: flex; align-items: center; justify-content: center; height: 108px; font-size: 3.4rem; }
.card-art svg { width: 100%; height: 100%; }
.card-foot  { display: flex; align-items: center; gap: 10px; }
.card-foot .grow { flex: 1 1 auto; }

.price { display: inline-flex; align-items: center; gap: 5px; font-weight: 800; color: var(--gold-dark); }
.price.cant { color: var(--red); }

.badge {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 999px;
  background: var(--wood);
  color: var(--cream);
  font-size: .74rem;
  font-weight: 700;
  letter-spacing: .03em;
}
.badge.owned  { background: var(--green-dark); }
.badge.active { background: var(--gold-dark); }
.badge.locked { background: #7a6a5a; }

.tag-row { display: flex; flex-wrap: wrap; gap: 6px; }

/* Sternchen-Werte */
.stat-row { display: flex; justify-content: space-between; gap: 12px; font-size: .84rem; color: var(--ink-soft); }
.stars { letter-spacing: 1px; color: var(--gold-dark); }

/* ---------- Reiter / Tabs ---------- */

.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.tab {
  padding: 9px 18px;
  border: 2px solid var(--wood-dark);
  border-radius: 999px;
  background: rgba(255,255,255,.12);
  color: var(--cream);
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}
.tab.active { background: linear-gradient(var(--straw-soft), var(--straw)); color: var(--ink); }

/* ---------- Editor ---------- */

.editor-layout {
  display: grid;
  gap: 20px;
  grid-template-columns: minmax(280px, 420px) 1fr;
  align-items: start;
}
@media (max-width: 820px) { .editor-layout { grid-template-columns: 1fr; } }

.editor-preview {
  position: sticky;
  top: 12px;
  padding: 18px;
  background: linear-gradient(#c8dff0, #eaf3fa 62%, #d9c290 62%, #c2a870);
  border: 3px solid var(--wood-dark);
  border-radius: var(--radius);
  text-align: center;
  box-shadow: var(--shadow);
}
.editor-preview svg { width: 100%; max-width: 340px; height: auto; }
.editor-preview .pv-name {
  margin-top: 6px;
  font-size: 1.35rem;
  font-weight: 800;
  color: var(--wood-dark);
}
.editor-preview .pv-breed { color: var(--ink-soft); font-size: .9rem; }

.opt-group { margin-bottom: 18px; }
.opt-group > label,
.opt-label {
  display: block;
  margin-bottom: 7px;
  font-weight: 800;
  color: var(--straw);
  letter-spacing: .02em;
}
.opt-row { display: flex; flex-wrap: wrap; gap: 8px; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 42px;
  padding: 6px 14px;
  border: 2px solid var(--wood-dark);
  border-radius: 999px;
  background: rgba(255,255,255,.9);
  color: var(--ink);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: transform .1s, box-shadow .1s;
}
.chip.active { background: linear-gradient(#ffdc84, #f2b632); box-shadow: 0 0 0 3px rgba(242,182,50,.45); }

@media (hover: hover) {
  .card.clickable:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
  .tab:hover  { background: rgba(255,255,255,.24); }
  .chip:hover { transform: translateY(-2px); }
}
.chip:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.chip .swatch {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 2px solid rgba(0,0,0,.35);
}

.text-input {
  width: 100%;
  max-width: 340px;
  min-height: 46px;
  padding: 10px 14px;
  border: 2px solid var(--wood-dark);
  border-radius: var(--radius-sm);
  background: #fff;
  color: var(--ink);
  font: inherit;
  font-size: 1.05rem;
}
.field-hint { font-size: .82rem; color: #cbb392; margin-top: 4px; }

.editor-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }

/* ---------- Streckenwahl ---------- */

.level-card .card-art {
  height: 118px;
  border-radius: var(--radius-sm);
  overflow: hidden;
  font-size: 0;
}
.level-card .card-art canvas,
.level-card .card-art svg { width: 100%; height: 100%; display: block; }
.level-records { display: flex; gap: 14px; font-size: .84rem; color: var(--ink-soft); }
.level-records b { color: var(--ink); }

/* ---------- Ergebnis ---------- */

.result-wrap {
  max-width: 560px;
  margin: 6vh auto;
  text-align: center;
}
.result-title { font-size: 2.2rem; color: var(--gold); margin-bottom: 4px; }
.result-lines { margin: 18px 0; display: flex; flex-direction: column; gap: 8px; }
.result-line {
  display: flex; justify-content: space-between;
  padding: 9px 16px;
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,.9);
  color: var(--ink);
  font-weight: 600;
}
.result-line.total {
  background: linear-gradient(#ffdc84, #f2b632);
  font-size: 1.2rem;
  font-weight: 800;
}
.result-line .new-record { color: var(--green-dark); font-weight: 800; }
.result-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

/* ---------- Modal ---------- */

#modal-root:empty { display: none; }
.modal-backdrop {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
           max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  background: rgba(20,13,8,.72);
  z-index: 60;
  animation: fade-in .16s ease;
}
/* Nur die Farbe wird eingeblendet, nicht die Deckkraft: sollte die Animation
   einmal nicht laufen, bleibt der Inhalt trotzdem sichtbar. */
@keyframes fade-in { from { background: rgba(20,13,8,0); } }
.modal {
  width: min(620px, 100%);
  max-height: 88vh;
  max-height: 88dvh;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 22px;
  background: linear-gradient(var(--cream), #f2e6cd);
  color: var(--ink);
  border: 4px solid var(--wood-dark);
  border-radius: 18px;
  box-shadow: var(--shadow-lg);
  animation: modal-in .2s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes modal-in { from { transform: scale(.92) translateY(10px); } }
.modal h3 { margin: 0 0 10px; font-size: 1.4rem; color: var(--wood-dark); }
/* Der Ghost-Button ist für dunkle Flächen gedacht — im hellen Modal braucht er dunkle Schrift. */
.modal .btn-ghost { background: rgba(74,50,34,.1); color: var(--ink); border-color: var(--wood); }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 18px; }

.info-list { margin: 0; padding-left: 20px; }
.info-list li { margin-bottom: 5px; }

/* ---------- leerer Zustand ---------- */

.empty-note {
  padding: 34px 20px;
  text-align: center;
  color: #cbb392;
  font-style: italic;
}
</style>
<style>
/* ==== css/stall.css ==== */
/* stall.css — Stallbildschirm: Bedürfnisse, lebendige Box, Werkzeugleiste, Deko */

#screen-stable { background: #241a12; }

.stable-layout {
  display: grid;
  grid-template-rows: auto 1fr auto;
  min-height: 100%;
}

/* ---------- Stallwechsel: Vorschau aller Boxen ---------- */

.stable-head { position: relative; }

.stall-strip {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 18px 8px;
  background: rgba(0,0,0,.38);
  border-bottom: 1px solid rgba(0,0,0,.3);
  overflow-x: auto;
}
.strip-label {
  flex: 0 0 auto;
  color: var(--straw);
  font-weight: 800;
  font-size: .78rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  opacity: .8;
}
.strip-tiles { display: flex; gap: 10px; }

.stall-tile {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  width: 96px;
  padding: 5px 5px 6px;
  border: 2px solid rgba(0,0,0,.35);
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,.07);
  color: var(--cream);
  font: inherit;
  cursor: pointer;
  transition: transform .12s, background .12s, border-color .12s;
}
/* Schwebe-Effekte nur mit Maus — am Finger blieben sie nach dem Tippen kleben. */
@media (hover: hover) {
  .stall-tile:hover { transform: translateY(-2px); background: rgba(255,255,255,.16); }
  .stall-tile.active:hover { transform: none; }
  .muck-pile:hover { filter: drop-shadow(0 0 6px rgba(255,220,132,.9)) brightness(1.2); }
  .tool:hover:not(:disabled) { transform: translateY(-3px); filter: brightness(1.06); }
}
.stall-tile.active {
  border-color: var(--gold);
  background: rgba(242,182,50,.22);
  box-shadow: 0 0 0 2px rgba(242,182,50,.35);
  cursor: default;
}

/* Die Miniatur der Box: Wand, Boden, Pferd */
.tile-box {
  position: relative;
  display: block;
  width: 100%;
  height: 52px;
  overflow: hidden;
  border-radius: 5px;
  background:
    linear-gradient(rgba(0,0,0,.28), rgba(0,0,0,0) 55%),
    repeating-linear-gradient(90deg, #7a5636 0 14px, #6d4c2f 14px 15px),
    #6d4c2f;
}
.tile-box::after {          /* Einstreu am Boden */
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 13px;
  background: repeating-linear-gradient(112deg, var(--straw) 0 2px, transparent 2px 6px), #b9954f;
}
.tile-box.lit-1 { box-shadow: inset 0 8px 14px rgba(255,228,170,.28); }
.tile-box.lit-2 { box-shadow: inset 0 9px 16px rgba(255,236,195,.42); }
.tile-box.lit-3 { box-shadow: inset 0 10px 18px rgba(255,244,215,.58); }

.tile-horse {
  position: absolute;
  left: 50%; bottom: 5px;
  width: 66%;
  transform: translateX(-50%);
  z-index: 1;
}
.tile-horse svg { width: 100%; height: auto; display: block; }

.tile-muck {
  position: absolute;
  top: 2px; right: 3px;
  z-index: 2;
  padding: 0 4px;
  border-radius: 999px;
  background: rgba(20,13,8,.85);
  font-size: .6rem;
  font-weight: 700;
}

.tile-name {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: .78rem;
  font-weight: 800;
}
.tile-cond { font-size: .68rem; font-weight: 700; }
.tile-cond.good { color: #a8dd86; }
.tile-cond.mid  { color: var(--gold); }
.tile-cond.bad  { color: #f09a90; }

.stall-tile.empty .tile-box {
  display: grid;
  place-items: center;
  background: rgba(255,255,255,.05);
  border: 2px dashed rgba(255,255,255,.22);
}
.stall-tile.empty .tile-box::after { content: none; }
.tile-plus { font-size: 1.5rem; opacity: .7; }
.stall-tile.empty .tile-name { opacity: .75; font-weight: 600; }

/* ---------- Kopfzeile mit Bedürfnissen ---------- */

.needs-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 12px 18px;
  background: rgba(0,0,0,.28);
  border-bottom: 2px solid rgba(0,0,0,.35);
}
.needs-title { color: var(--straw); font-weight: 800; font-size: 1.1rem; margin-right: 6px; }
.needs-title small { display: block; font-weight: 500; font-size: .75rem; color: #bda98d; }

.need {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 62px;
  padding: 4px 6px;
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,.07);
  cursor: help;
}
.need-ring {
  --pct: 100;
  --col: var(--green);
  width: 42px; height: 42px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: conic-gradient(var(--col) calc(var(--pct) * 1%), rgba(255,255,255,.14) 0);
}
.need-ring::before {
  content: "";
  position: absolute;
  width: 32px; height: 32px;
  border-radius: 50%;
  background: #2f2115;
}
.need-icon { position: relative; font-size: 1.1rem; line-height: 1; }
.need-val { font-size: .74rem; font-weight: 700; color: var(--cream); }
.need-name { font-size: .68rem; color: #bda98d; }
.need.low .need-icon { animation: need-pulse 1s ease-in-out infinite; }
@keyframes need-pulse { 50% { transform: scale(1.22); } }

.muck-warning {
  padding: 7px 14px;
  border-radius: 999px;
  background: rgba(140,90,40,.5);
  border: 2px solid #8a5a28;
  color: var(--straw-soft);
  font-weight: 800;
  animation: need-pulse 1.6s ease-in-out infinite;
}

.condition-badge {
  margin-left: auto;
  display: flex; align-items: center; gap: 10px;
  padding: 7px 16px;
  border-radius: 999px;
  background: rgba(255,255,255,.1);
  border: 2px solid rgba(255,255,255,.18);
  color: var(--cream);
  font-weight: 700;
}
.condition-badge .cnum { font-size: 1.25rem; }
.condition-badge.good  { border-color: var(--green);  color: #cdeeb8; }
.condition-badge.mid   { border-color: var(--gold);   color: #f7e0a8; }
.condition-badge.bad   { border-color: var(--red);    color: #f4bdb7; }

/* ---------- Die Box ---------- */

.box-scene {
  position: relative;
  overflow: hidden;
  min-height: 380px;

  /* Mit leerer Hand darf der Finger ueber die Box hinweg die Seite scrollen —
     Streicheln und Aepfel wegtippen sind kurze Tipper, das stoert sich nicht.
     Sobald ein Werkzeug in der Hand ist, gehoert die Flaeche dem Striegeln,
     Einstreuen und Ruecken der Deko; dann darf nichts mehr wegrutschen. */
  touch-action: pan-y;
  background:
    repeating-linear-gradient(90deg, #7a5636 0 54px, #6d4c2f 54px 57px),
    #6d4c2f;
}
.box-scene::before {   /* warmes Licht von oben */
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% -10%, rgba(255,225,160,.42), transparent 62%);
  pointer-events: none;
  z-index: 0;
}
.box-scene.lit-1::before { background: radial-gradient(ellipse at 50% -10%, rgba(255,228,170,.55), transparent 66%); }
.box-scene.lit-2::before { background: radial-gradient(ellipse at 50% -10%, rgba(255,236,195,.72), transparent 72%); }
.box-scene.lit-3::before { background: radial-gradient(ellipse at 50% -10%, rgba(255,244,215,.9),  transparent 80%); }

/* Boden mit Einstreu */
.box-floor {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 96px;
  background: linear-gradient(#4a3626, #3a2a1c);
  border-top: 3px solid #2f2114;
  z-index: 1;
}
.box-bedding {
  position: absolute;
  inset: 0;
  opacity: calc(var(--bedding, 1));
  background:
    repeating-linear-gradient(112deg, var(--straw) 0 3px, transparent 3px 9px),
    repeating-linear-gradient(65deg,  var(--straw-soft) 0 2px, transparent 2px 11px),
    #caa259;
  transition: opacity .4s;
}

/* Bahnen beim Einstreuen */
.bed-cells { position: absolute; inset: 0; pointer-events: none; }
.bed-cell {
  position: absolute;
  bottom: 0; height: 100%;
  opacity: 0;
  background:
    repeating-linear-gradient(112deg, #f0d78d 0 3px, transparent 3px 9px),
    #d9b463;
  transition: opacity .18s;
}
.bed-cell.filled { opacity: 1; }

/* ---------- Einrichtung: Tränke und Raufe ---------- */

.prop { position: absolute; z-index: 2; }

.trough { left: 4%; bottom: 34px; width: 128px; }
.trough-body {
  position: relative;
  height: 64px;
  overflow: hidden;
  border: 4px solid #3b2716;
  border-radius: 5px 5px 16px 16px;
  background: linear-gradient(#a37a50, #6b4a2f 55%, #4a3120);
  box-shadow: var(--shadow), inset 0 6px 10px rgba(0,0,0,.35);
}
.trough-body::after {          /* Dauben-Struktur */
  content: "";
  position: absolute; inset: 0;
  background: repeating-linear-gradient(90deg, rgba(0,0,0,.16) 0 2px, transparent 2px 22px);
  pointer-events: none;
}
.trough-water {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 60%;
  background: linear-gradient(#7cc4e6, #2f6d94);
  transition: height .5s ease;
}
.trough-water::after {
  content: "";
  position: absolute; top: 2px; left: 8%; right: 8%;
  height: 3px; border-radius: 3px;
  background: rgba(255,255,255,.55);
}
.trough .prop-label {
  position: absolute; top: -22px; left: 50%;
  transform: translateX(-50%);
  font-size: .95rem;
  opacity: .75;
}

.hayrack { right: 4%; bottom: 96px; width: 116px; }
.rack-body {
  position: relative;
  height: 84px;
  overflow: hidden;
  border: 4px solid #3b2716;
  border-radius: 8px 8px 4px 4px;
  background: linear-gradient(#5a4028, #3a2a1c);
  box-shadow: var(--shadow);
}
.rack-hay {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 60%;
  background:
    repeating-linear-gradient(112deg, var(--straw) 0 3px, transparent 3px 8px),
    #cfa758;
  transition: height .5s ease;
}
.rack-body::after {   /* Gitterstäbe davor */
  content: "";
  position: absolute; inset: 0;
  background: repeating-linear-gradient(90deg, #5c3f28 0 5px, transparent 5px 17px);
}

/* ---------- Pferdeäpfel ---------- */

.muck-layer { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.muck-pile {
  position: absolute;
  width: 30px; height: 22px;
  pointer-events: auto;
  cursor: pointer;
  filter: drop-shadow(0 2px 2px rgba(0,0,0,.45));
}
.muck-ball {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, #6f4c2b, #38240f);
}
.muck-ball.b1 { width: 15px; height: 13px; left: 0;   bottom: 0; }
.muck-ball.b2 { width: 13px; height: 11px; left: 13px; bottom: 1px; }
.muck-ball.b3 { width: 12px; height: 10px; left: 6px;  bottom: 8px; }

.box-scene[data-tool="muck"] .muck-pile::after {
  content: "";
  position: absolute; inset: -8px;
  border-radius: 50%;
  border: 2px dashed rgba(255,220,132,.75);
  animation: muck-ring 1.6s ease-in-out infinite;
}
@keyframes muck-ring { 50% { transform: scale(1.14); opacity: .45; } }

.muck-pile.dropping { animation: muck-drop .6s cubic-bezier(.3,1.4,.6,1); }
@keyframes muck-drop {
  0%   { transform: translateY(-70px) scale(.6); opacity: 0; }
  60%  { transform: translateY(0) scale(1.15); opacity: 1; }
  100% { transform: translateY(0) scale(1); }
}
.muck-pile.cleared { animation: muck-clear .26s ease-in forwards; }
@keyframes muck-clear { to { transform: translate(30px, -24px) scale(.2); opacity: 0; } }

/* ---------- Das Pferd ---------- */

.box-horse {
  position: absolute;
  left: 50%;
  bottom: 56px;
  width: min(340px, 44%);
  z-index: 4;
  transform: translateX(-50%) scaleX(var(--flip, 1));
  filter: drop-shadow(0 14px 12px rgba(0,0,0,.45));
  transition: filter .3s;
}
.horse-svg svg { width: 100%; height: auto; display: block; }

.box-horse.sad { filter: drop-shadow(0 14px 12px rgba(0,0,0,.45)) saturate(.65) brightness(.9); }

/* Atmen im Stand */
.box-horse.breathing .horse-svg { animation: breathe 3.6s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes breathe { 50% { transform: scaleY(1.014) scaleX(1.006); } }

/* Gehen: leichtes Wippen plus Schrittzyklus der Beine */
.box-horse.walking .horse-svg { animation: walkbob .64s ease-in-out infinite; }
@keyframes walkbob { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-3px) rotate(-.4deg); } }

.box-horse.walking .horse-leg { animation: leg-step .64s ease-in-out infinite; }
.box-horse.walking .leg-0 { animation-delay: 0s; }
.box-horse.walking .leg-1 { animation-delay: .32s; }
.box-horse.walking .leg-2 { animation-delay: .16s; }
.box-horse.walking .leg-3 { animation-delay: .48s; }
@keyframes leg-step { 0%,100% { transform: rotate(-11deg); } 50% { transform: rotate(11deg); } }

/* Schweif wedelt immer ein wenig */
.horse-tail { animation: tail-swish 3.4s ease-in-out infinite; }
@keyframes tail-swish { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(6deg); } }
.box-horse.walking .horse-tail { animation-duration: 1.6s; }

/* Kopf: grasen, fressen, trinken */
.box-horse.grazing .horse-head { animation: graze 5s ease-in-out infinite; }
@keyframes graze {
  0%, 12%, 100% { transform: rotate(0deg); }
  30%, 78%      { transform: rotate(30deg) translate(-3px, 5px); }
}
.box-horse.eating .horse-head { animation: munch .45s ease-in-out infinite; }
@keyframes munch {
  0%, 100% { transform: rotate(22deg) translate(-2px, 3px); }
  50%      { transform: rotate(27deg) translate(-2px, 5px); }
}
.box-horse.drinking .horse-head { animation: sip 1.1s ease-in-out infinite; }
@keyframes sip {
  0%, 100% { transform: rotate(34deg) translate(-4px, 7px); }
  50%      { transform: rotate(38deg) translate(-4px, 10px); }
}

/* Ohren zucken */
.box-horse.ear-flick .ear-l { animation: ear 0.35s ease-in-out 2; }
.box-horse.ear-flick .ear-r { animation: ear 0.35s ease-in-out 2 .12s; }
@keyframes ear { 50% { transform: rotate(-16deg); } }

/* Streicheln */
.box-horse.petted .horse-svg { animation: hop .5s ease-in-out 3; }
@keyframes hop { 0%,100% { transform: translateY(0); } 45% { transform: translateY(-8px); } }

/* Schmutzflecken auf dem Fell */
.dirt-layer { position: absolute; inset: 0; pointer-events: none; }
.dirt-spot {
  position: absolute;
  width: 34px; height: 26px;
  border-radius: 50%;
  background: radial-gradient(ellipse, rgba(84,60,34,.92), rgba(84,60,34,.28) 70%, transparent);
  transition: opacity .2s;
}

/* Marken beim Beschlagen */
.hoof-layer { position: absolute; inset: 0; }
.hoof-marker {
  position: absolute;
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: linear-gradient(#ffdc84, #f2b632);
  border: 2px solid var(--gold-dark);
  box-shadow: var(--shadow-sm);
  font-size: .95rem;
  cursor: pointer;
  /* Gegenspiegelung, damit das Symbol auch bei blickrichtung links stimmt */
  transform: translate(-50%, -50%) scaleX(var(--flip, 1));
  animation: hoof-pulse 1.2s ease-in-out infinite;
}
@keyframes hoof-pulse { 50% { box-shadow: 0 0 0 7px rgba(242,182,50,.28); } }
.hoof-marker.done {
  background: linear-gradient(#9ad47a, #6aa84f);
  border-color: var(--green-dark);
  animation: none;
  cursor: default;
}

/* Namensschild und Sprechblase folgen dem Pferd */
.horse-nameplate {
  position: absolute;
  bottom: 14px;
  transform: translateX(-50%);
  z-index: 5;
  padding: 3px 18px;
  border-radius: 8px;
  background: linear-gradient(#8b6440, #5c3f28);
  border: 2px solid #3b2716;
  color: var(--straw-soft);
  font-weight: 800;
  letter-spacing: .06em;
  box-shadow: var(--shadow-sm);
  pointer-events: none;
  transition: left .1s linear;
}
.action-bubble {
  position: absolute;
  top: 14%;
  transform: translateX(-50%);
  z-index: 6;
  padding: 7px 16px;
  border-radius: 999px;
  background: rgba(253,246,230,.96);
  border: 2px solid var(--wood-dark);
  color: var(--ink);
  font-weight: 800;
  white-space: nowrap;
  box-shadow: var(--shadow);
  pointer-events: none;
  animation: bubble-in .2s ease;
}
@keyframes bubble-in { from { transform: translateX(-50%) scale(.7); } }

/* ---------- Hinweisleiste beim aktiven Werkzeug ---------- */

.scene-hint {
  position: absolute;
  top: 12px; left: 50%;
  transform: translateX(-50%);
  z-index: 7;
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: 92%;
  padding: 8px 10px 8px 16px;
  border-radius: 999px;
  background: rgba(20,13,8,.82);
  border: 2px solid var(--gold-dark);
  color: var(--cream);
  font-weight: 600;
  box-shadow: var(--shadow);
}
.scene-hint .hint-icon { font-size: 1.3rem; }
.hint-cancel {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,.16);
  color: var(--cream);
  font: inherit;
  font-weight: 800;
  cursor: pointer;
}

/* Zeiger und Hervorhebung je nach Werkzeug */
.box-scene.tool-active,
.box-scene.decor-mode { touch-action: none; }
.box-scene.tool-active { cursor: pointer; }
.box-scene.tool-active[data-tool="groom"],
.box-scene.tool-active[data-tool="brush"],
.box-scene.tool-active[data-tool="bed"] { cursor: grab; }
.box-scene.tool-active[data-tool="groom"]:active,
.box-scene.tool-active[data-tool="brush"]:active,
.box-scene.tool-active[data-tool="bed"]:active { cursor: grabbing; }

.box-scene.tool-active[data-tool="feed"]  .box-horse,
.box-scene.tool-active[data-tool="water"] .box-horse,
.box-scene.tool-active[data-tool="groom"] .box-horse,
.box-scene.tool-active[data-tool="brush"] .box-horse {
  filter: drop-shadow(0 0 12px rgba(255,220,132,.95)) drop-shadow(0 14px 12px rgba(0,0,0,.45));
}
.box-scene.tool-active[data-tool="water"] .trough-body { box-shadow: 0 0 0 3px rgba(255,220,132,.85); }
.box-scene.tool-active[data-tool="bed"]   .box-floor   { box-shadow: inset 0 0 0 3px rgba(255,220,132,.75); }

/* ---------- Deko ---------- */

.prop-layer { position: absolute; inset: 0; z-index: 2; }

.decor-item {
  position: absolute;
  transform: translate(-50%, -50%);
  font-size: 2.6rem;
  line-height: 1;
  filter: drop-shadow(0 4px 5px rgba(0,0,0,.4));
  user-select: none;
}
.decor-item.big   { font-size: 4rem; }
.decor-item.huge  { font-size: 5.2rem; }
.decor-item.drawn { font-size: 0; }
.decor-item.drawn svg { width: 100%; height: auto; display: block; }

.lickstone-item {
  font-size: 2.1rem;
  filter: drop-shadow(0 3px 4px rgba(0,0,0,.45));
}

.decor-mode .prop-layer { pointer-events: auto; }
.decor-mode .decor-item {
  cursor: grab;
  outline: 2px dashed rgba(255,255,255,.5);
  outline-offset: 4px;
  border-radius: 8px;
}
.decor-mode .decor-item:active { cursor: grabbing; }

/* Kronleuchter hängt an einer Schnur und schwingt leicht */
.decor-item.chandelier { transform-origin: 50% -80px; animation: sway 6s ease-in-out infinite; }
.decor-item.chandelier::before {
  content: "";
  position: absolute;
  left: 50%; bottom: 82%;
  width: 3px; height: 400px;
  background: #4a3a25;
  transform: translateX(-50%);
}
@keyframes sway {
  0%,100% { transform: translate(-50%,-50%) rotate(-1.4deg); }
  50%     { transform: translate(-50%,-50%) rotate(1.4deg); }
}

/* ---------- Werkzeugleiste ---------- */

.food-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 10px 18px;
  background: rgba(0,0,0,.3);
  border-top: 2px solid rgba(0,0,0,.35);
}
.food-label { color: var(--straw); font-weight: 800; }
.food-chip { min-height: 38px; }

.toolbar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: stretch;
  padding: 14px max(18px, env(safe-area-inset-right))
           max(14px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
  background: linear-gradient(#5c3f28, #46301e);
  border-top: 3px solid var(--wood-dark);
}
.tool {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-width: 82px;
  min-height: 76px;
  padding: 8px 10px;
  border: 2px solid rgba(0,0,0,.3);
  border-radius: var(--radius-sm);
  background: linear-gradient(var(--straw-soft), var(--straw));
  color: var(--ink);
  font: inherit;
  font-weight: 700;
  font-size: .8rem;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: transform .1s, filter .12s;
}
.tool:active:not(:disabled) { transform: translateY(1px); }
.tool:disabled { opacity: .42; cursor: not-allowed; }
.tool .tool-icon { font-size: 1.7rem; line-height: 1; }
.tool .tool-need { position: absolute; top: 4px; right: 6px; font-size: .68rem; color: var(--ink-soft); }
.tool .tool-count {
  position: absolute; bottom: 4px; right: 6px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--wood);
  color: var(--cream);
  font-size: .68rem;
}
.tool.urgent { box-shadow: 0 0 0 3px rgba(209,86,74,.75), var(--shadow-sm); }
.tool.done   { filter: grayscale(.35); opacity: .7; }
.tool.picked {
  background: linear-gradient(#ffdc84, #f2b632);
  box-shadow: 0 0 0 3px var(--gold), var(--shadow);
  transform: translateY(-3px);
}

.toolbar-sep { width: 2px; background: rgba(0,0,0,.28); margin: 4px 4px; border-radius: 2px; }
.toolbar .grow { flex: 1 1 auto; }
.big-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

@media (max-width: 760px) {
  .stall-strip { padding: 8px 10px 6px; gap: 8px; }
  .strip-label { display: none; }
  .stall-tile { width: 78px; }
  .tile-box { height: 42px; }
  .box-horse { width: min(280px, 52%); }
  .scene-hint { font-size: .85rem; padding: 6px 8px 6px 12px; }

  .box-scene { min-height: 280px; }
}

/* Wenig Platz — schmales Handy hochkant oder ein flaches Fenster im Querformat.
   Beide Faelle brauchen dasselbe: flacher Kopf, erreichbare Werkzeuge. */
@media (max-width: 760px), (max-height: 520px) {
  .needs-bar { gap: 7px; padding: 8px 10px; }
  .needs-title { font-size: .98rem; margin-right: 2px; }
  .need { min-width: 48px; padding: 2px 4px; }
  .need-ring { width: 34px; height: 34px; }
  .need-ring::before { width: 26px; height: 26px; }
  .need-icon { font-size: .95rem; }
  .condition-badge { padding: 5px 12px; gap: 6px; }
  .condition-badge .cnum { font-size: 1.1rem; }

  /* Werkzeug waehlen, dann in die Box tippen: beides muss gleichzeitig zu
     sehen sein. Statt die Seite scrollen zu lassen, bekommt der Bildschirm
     hier feste Zonen — Kopf oben, Werkzeuge unten, die Box nimmt den Rest.
     Reicht es trotzdem nicht (sehr kleines Geraet), scrollt der Bildschirm
     wie bisher weiter. */
  .stable-layout { height: 100%; }
  .box-scene { min-height: 140px; height: 100%; }

  .toolbar {
    gap: 6px;
    padding: 8px max(10px, env(safe-area-inset-right))
             max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    box-shadow: 0 -8px 18px rgba(0,0,0,.45);
  }
  .tool { min-width: 62px; min-height: 58px; padding: 5px 4px; gap: 1px; font-size: .66rem; }
  .tool .tool-icon { font-size: 1.35rem; }
  .tool .tool-need { top: 2px; right: 4px; font-size: .6rem; }
  .tool .tool-count { bottom: 2px; right: 4px; font-size: .6rem; }
  .toolbar-sep { display: none; }
  .big-actions { gap: 6px; }
  .big-actions .btn { min-height: 42px; padding: 6px 12px; font-size: .85rem; }
  .food-row { padding: 8px 10px; gap: 6px; }
}

/* Handy quer: kaum Hoehe. Boxenwahl und Beduerfnisse ruecken nebeneinander,
   damit vom Bildschirm ueberhaupt etwas fuer die Box uebrig bleibt. */
@media (max-height: 520px) {
  .stable-head { display: flex; align-items: stretch; }
  .strip-slot { flex: 0 1 auto; min-width: 0; max-width: 42%; }
  .needs-slot { flex: 1 1 auto; min-width: 0; }
  .needs-bar  { height: 100%; flex-wrap: nowrap; overflow-x: auto; }
  .stall-strip { height: 100%; border-right: 2px solid rgba(0,0,0,.35); }

  /* Unter etwa 240 px sieht man von der Box nur noch Hufe — hier ist Scrollen
     die bessere Bedienung als eine Box, in der nichts zu erkennen ist. */
  .stable-layout { height: auto; min-height: 100%; }
  .box-scene { height: auto; min-height: 240px; }

  .tool { min-height: 50px; min-width: 56px; font-size: .62rem; }

.pasture-field::after {
  content: "";
  position: absolute;
  top: 6%; right: 9%;

  background: radial-gradient(circle, #fff3c4, #ffd964 60%, rgba(255,217,100,0));

.pasture-fence {
  position: absolute;
  left: 0; right: 0;
  top: 33%;
  height: 54px;
  pointer-events: none;
  background:

    linear-gradient(transparent 12px, #e8dcc0 12px 19px, transparent 19px 34px, #e8dcc0 34px 41px, transparent 41px);
  opacity: .95;

.grass-layer { position: absolute; inset: 34% 0 0 0; pointer-events: none; }
.tuft {
  position: absolute;
  width: 12px;
  height: calc(16px * var(--grass) + 3px);
  border-radius: 60% 60% 20% 20% / 90% 90% 10% 10%;
  background: linear-gradient(#8fce6f, #4f7a38);
  opacity: calc(.25 + var(--grass) * .75);
  transform-origin: 50% 100%;
  transition: height .6s, opacity .6s;

.tuft.row-0 { filter: brightness(.85); }
.tuft.row-2 { filter: brightness(1.12); }

.pasture-field.nobody::after { opacity: .9; }

.roster-name { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; font-weight: 800; }

/* ==== css/hud.css ==== */
/* hud.css — Parcours-Bildschirm: Canvas, HUD, Overlays */

#screen-ride { background: #10161d; overflow: hidden; }

.ride-wrap {
  position: relative;
  width: 100%;
  height: 100%;
  display: grid;
  place-items: center;
  background: radial-gradient(ellipse at 50% 40%, #1d2a36, #0b1015);
}

#ride-canvas {
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  display: block;
  image-rendering: auto;
  /* Kein eigener Hintergrund: sonst laege ueber den Letterbox-Raendern
     Himmelblau und das Bild saehe aus, als waere es falsch beschnitten. */
  background: transparent;

  /* Die Zeichenflaeche ist 960x540. Ohne "contain" zieht der Browser sie auf
     jedes Fensterformat auseinander — auf dem Handy waere das Pferd lang wie
     ein Dackel. Lieber Balken oben und unten als ein verzerrtes Bild. */
  object-fit: contain;

  /* Tippen und Halten steuert das Pferd: kein Scrollen, kein Zoom, keine
     Textauswahl, kein Kontextmenue beim langen Druecken. */
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

#ride-hud {
  position: absolute;
  inset: 0;
  padding: max(14px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right))
           max(14px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
  color: #fff;
  text-shadow: 0 2px 4px rgba(0,0,0,.55);
}

.hud-row { display: flex; align-items: center; gap: 10px; }
.hud-top .hud-coins { margin-left: auto; }

  background: rgba(18,12,8,.6);
  border: 2px solid rgba(255,255,255,.22);
  font-weight: 800;
  font-size: 1rem;
  backdrop-filter: blur(3px);
}
.hud-chip.hud-coins { background: rgba(201,138,19,.82); border-color: rgba(255,220,132,.7); }
.hud-btn { pointer-events: auto; cursor: pointer; color: #fff; font: inherit; font-weight: 800; }
@media (hover: hover) {
  .hud-btn:hover { background: rgba(209,86,74,.85); }
}

/* Der Verlassen-Knopf wird am Finger leicht verfehlt. */
#hud-quit { min-width: 46px; min-height: 46px; justify-content: center; }

.hud-bars { display: flex; flex-direction: column; gap: 7px; max-width: 520px; }
.hud-bar {
  position: relative;
  height: 20px;
  border-radius: 999px;
  background: rgba(10,8,6,.55);
  border: 2px solid rgba(255,255,255,.22);

}
.hud-bar-fill {
  height: 100%;
  width: 0;
  border-radius: 999px;
  background: linear-gradient(90deg, #ffdc84, #f2b632);
  transition: width .12s linear;
}
.hud-stamina .hud-bar-fill { background: linear-gradient(90deg, #9ad47a, #6aa84f); }
.hud-stamina.empty .hud-bar-fill { background: linear-gradient(90deg, #e8837a, #d1564a); }
.hud-bar-label {
  position: absolute;
  left: 12px; top: 50%;

  font-weight: 700;
  letter-spacing: .05em;

  opacity: .95;
}
.hud-marker {
  position: absolute;
  top: -9px;
  left: 0;
  font-size: 1.1rem;
  transform: translateX(-50%);
  transition: left .12s linear;
  filter: drop-shadow(0 2px 3px rgba(0,0,0,.6));

.hud-help {
  margin-top: auto;
  align-self: center;
  padding: 7px 16px;
  border-radius: 999px;
  background: rgba(18,12,8,.5);
  font-size: .86rem;
  transition: opacity .6s;
}
.hud-help.fade { opacity: 0; }

/* ---------- Bedienung am Finger ---------- */

/* Springen geht ueberall auf der Flaeche — Ducken und Sprinten brauchen einen
   festen Platz fuer den Daumen. Beide Knoepfe liegen aussen unten, damit die

.hud-touch {
  display: none;
  margin-top: auto;
  justify-content: space-between;
  align-items: flex-end;
  gap: 12px;
}
.hud-pad {
  pointer-events: auto;
  touch-action: none;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  width: 92px;
  min-height: 74px;

  border-radius: 22px;

  transition: background .1s, transform .08s;

.hud-pad .pad-icon { font-size: 1.6rem; line-height: 1; }
.hud-pad.pressed { background: rgba(242,182,50,.6); border-color: rgba(255,220,132,.9); transform: scale(.95); }
.hud-pad:disabled { opacity: .35; }

@media (pointer: coarse) {

/* ---------- Hochformat ---------- */

/* Hochkant bleibt vom 16:9-Bild nur ein schmaler Streifen — spielbar, aber

#ride-rotate {
  display: none;
  position: absolute;
  left: 50%;
  top: 22%;                       /* nicht ueber dem Pferd, sonst verdeckt er das Spiel */
  transform: translateX(-50%);

  width: max-content;
  max-width: 80%;
  padding: 14px 20px;
  border-radius: 18px;
  background: rgba(18,12,8,.82);
  border: 2px solid rgba(255,255,255,.3);

  line-height: 1.35;
  text-align: center;
  pointer-events: none;
}
#ride-rotate::before {

@keyframes rotate-hint {

}

/* ---------- Overlays im Parcours ---------- */

#ride-overlay {
  position: absolute;
  inset: 0;

  place-items: center;

.ov-lost { color: var(--red); font-weight: 800; }
.ov-saved { color: var(--green-dark); font-weight: 800; }

.countdown {

@media (max-width: 700px) {

  .hud-chip { font-size: .85rem; padding: 5px 11px; }
  .hud-bar  { height: 16px; }
  .hud-pad  { width: 78px; min-height: 66px; }

}

function formatTime(s) {
  if (s == null) return '—';
  const m = Math.floor(s / 60);
  const rest = (s - m * 60);
  return m > 0
    ? `${m}:${rest.toFixed(1).padStart(4, '0').replace('.', ',')}`
    : `${rest.toFixed(1).replace('.', ',')} s`;
}

/** Deterministischer Zufall — gleiche Strecke sieht immer gleich aus. */
function seeded(seed) {
  let s = seed >>> 0 || 1;
  return () => {
    s ^= s << 13; s >>>= 0;
    s ^= s >> 17;
    s ^= s << 5;  s >>>= 0;
    return s / 4294967296;
  };
}

/* ---------- Toast ---------- */

function toast(msg, kind = '') {
  const root = $('#toast-root');
  const node = el('div', { class: `toast ${kind}`, text: msg });
  root.append(node);
  setTimeout(() => node.remove(), 2300);
}

/* ---------- Modal ---------- */

let modalCleanup = null;

/**
 * Modal öffnen.
 * @param {{title?:string, body:Node|string, actions?:Array, onClose?:Function, wide?:boolean}} opts
 * @returns {{close:Function, root:HTMLElement}}
 */
function modal({ title, body, actions = [], onClose, dismissable = true }) {
  closeModal();

  const box = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' });
  if (title) box.append(el('h3', { text: title }));
  box.append(body.nodeType ? body : el('div', { html: body }));

  if (actions.length) {
    box.append(el('div', { class: 'modal-actions' },
      actions.map(a => el('button', {
        class: `btn ${a.class || ''}`,
        disabled: a.disabled,
        onclick: () => { if (a.keepOpen !== true) close(); a.onClick?.(); }
      }, a.label))
    ));
  }

  const backdrop = el('div', {
    class: 'modal-backdrop',
    onclick: e => { if (dismissable && e.target === backdrop) close(); }
  }, box);

  const onKey = e => { if (e.key === 'Escape' && dismissable) close(); };
  document.addEventListener('keydown', onKey);

  function close() {
    document.removeEventListener('keydown', onKey);
    backdrop.remove();
    modalCleanup = null;
    onClose?.();
  }
  modalCleanup = close;

  $('#modal-root').append(backdrop);
  return { close, root: box };
}

function closeModal() { modalCleanup?.(); }

/** Ja/Nein-Rückfrage. */
function confirmDialog(title, text, onYes, yesLabel = 'Ja') {
  modal({
    title,
    body: el('p', { text }),
    actions: [
      { label: 'Abbrechen', class: 'btn-ghost' },
      { label: yesLabel, class: 'btn-primary', onClick: onYes }
    ]
  });
}

/** Zeigersteuerung (Maus + Touch) auf einem Element, normalisiert auf lokale Koordinaten. */
function onDrag(node, { onStart, onMove, onEnd } = {}) {
  let active = false;

  const local = e => {
    const r = node.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top, w: r.width, h: r.height };
  };
  const down = e => {
    active = true;
    node.setPointerCapture?.(e.pointerId);
    onStart?.(local(e), e);
  };
  const move = e => {
    const p = local(e);
    if (active) onMove?.(p, e);
    else onMove?.(p, e, true);   // Hover: dritter Parameter = "nicht gedrückt"
  };
  const up = e => { if (!active) return; active = false; onEnd?.(local(e), e); };

  node.addEventListener('pointerdown', down);
  node.addEventListener('pointermove', move);
  node.addEventListener('pointerup', up);
  node.addEventListener('pointercancel', up);
  node.addEventListener('pointerleave', up);

  return () => {
    node.removeEventListener('pointerdown', down);
    node.removeEventListener('pointermove', move);
    node.removeEventListener('pointerup', up);
    node.removeEventListener('pointercancel', up);
    node.removeEventListener('pointerleave', up);
  };
}

__def('js/util/fullscreen.js', function (__exports, __req) {
/* fullscreen.js — Vollbild und Bildschirmlage
 *
 * Auf dem Handy soll das Spiel den ganzen Schirm bekommen: Adressleiste und
 * Systemleisten weg, damit die Box und der Parcours nicht auf zwei Drittel
 * Hoehe gedraengt werden.
 *
 * Zwei Dinge machen das unbequem:
 *
 *   1. Vollbild gibt es nur direkt aus einer Nutzergeste heraus. Von selbst
 *      laesst sich der Modus nicht betreten — deshalb haengt der Aufruf am
 *      ersten Tippen im Titelmenue und am Start eines Parcours.
 *   2. iPhones koennen es gar nicht: Safari kennt die Vollbild-Schnittstelle
 *      auf dem iPhone nicht (nur fuer Video). Dort ist der Weg "Zum
 *      Home-Bildschirm hinzufuegen" — das Spiel startet dann ohne
 *      Browserleiste. Darauf weisen die Einstellungen hin.
 *
 * Alles hier scheitert leise: Wo es kein Vollbild gibt, laeuft das Spiel
 * einfach im Fenster weiter.
 */

const root = () => document.documentElement;

/** Kennt dieser Browser ueberhaupt Vollbild? (iPhone: nein) */
function fullscreenSupported() {
  const el = root();
  return !!(el.requestFullscreen || el.webkitRequestFullscreen);
}

function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}

/** Fordert Vollbild an. Muss aus einem Klick heraus gerufen werden. */
function enterFullscreen() {
  const el = root();
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req || isFullscreen()) return Promise.resolve(isFullscreen());
  // navigationUI: 'hide' bittet Android, auch die Systemleisten auszublenden.
  return Promise.resolve(req.call(el, { navigationUI: 'hide' }))
    .then(() => true)
    .catch(() => false);
}

function exitFullscreen() {
  const fn = document.exitFullscreen || document.webkitExitFullscreen;
  if (!fn || !isFullscreen()) return Promise.resolve(false);
  return Promise.resolve(fn.call(document)).then(() => true).catch(() => false);
}

function toggleFullscreen() {
  return isFullscreen() ? exitFullscreen() : enterFullscreen();
}

/** Wird gerufen, sobald der Nutzer den Modus verlaesst oder betritt. */
function onFullscreenChange(fn) {
  document.addEventListener('fullscreenchange', fn);
  document.addEventListener('webkitfullscreenchange', fn);
}

/* ---------------------------------------------------------------- Lage */

/**
 * Bittet um Querformat — der Parcours lebt davon. Die Sperre gilt nur im
 * Vollbild und nur dort, wo der Browser sie kennt (Android/Chrome); sonst
 * bleibt es beim Hinweis im Bild, das Geraet zu drehen.
 */
function lockLandscape() {
  const o = screen.orientation;
  if (!o?.lock) return Promise.resolve(false);
  return Promise.resolve(o.lock('landscape')).then(() => true).catch(() => false);
}

function unlockOrientation() {
  try { screen.orientation?.unlock?.(); } catch { /* nicht unterstuetzt */ }
}
Object.assign(__exports, { enterFullscreen, exitFullscreen, fullscreenSupported, isFullscreen, lockLandscape, onFullscreenChange, toggleFullscreen, unlockOrientation });
});

__def('js/util/audio.js', function (__exports, __req) {
/* audio.js — Klänge über die Web Audio API. Keine Audiodateien nötig:
 * alles wird zur Laufzeit synthetisiert.
 */

let ctx = null;
let enabled = true;
let master = null;

function ac() {
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.9;
    master.connect(ctx.destination);
  }
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}

/** Der Audio-Kontext, damit die Musik denselben Ausgang nutzt. */
function audioContext() { return ac(); }
function masterOut()    { ac(); return master; }

function setSound(on) {
  enabled = on;
  if (master) master.gain.value = on ? 0.9 : 0;
}
function isSoundOn() { return enabled; }

/* ---------------------------------------------------------------- Bausteine */

function tone({ freq = 440, dur = .15, type = 'sine', gain = .18, slide = 0, delay = 0, out = null }) {
  if (!enabled) return;
  const c = ac(); if (!c) return;
  const t0 = c.currentTime + delay;

  const osc = c.createOscillator();
  const g = c.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t0 + dur);

  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

  osc.connect(g).connect(out || master);
  osc.start(t0);
  osc.stop(t0 + dur + .02);
}

/** Gefiltertes Rauschen — die Grundlage für Hufe, Bürste, Stroh, Schnauben. */
function noise({ dur = .12, gain = .12, filter = 1200, type = 'bandpass', q = 1, delay = 0, decay = true }) {
  if (!enabled) return null;
  const c = ac(); if (!c) return null;
  const t0 = c.currentTime + delay;

  const len = Math.max(1, Math.floor(c.sampleRate * dur));
  const buf = c.createBuffer(1, len, c.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) {
    data[i] = (Math.random() * 2 - 1) * (decay ? (1 - i / len) : 1);
  }

  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter(); f.type = type; f.frequency.value = filter; f.Q.value = q;
  const g = c.createGain(); g.gain.value = gain;

  src.connect(f).connect(g).connect(master);
  src.start(t0);
  return { src, g, t0 };
}

/* ---------------------------------------------------------------- Pferdelaute */

/**
 * Wiehern: ein absteigender Ton, dem ein schnelles Zittern aufmoduliert wird —
 * das erzeugt das typische "Flattern" eines Pferdelauts.
 */
function whinny({ pitch = 1, dur = 0.75, gain = 0.075 } = {}) {
  if (!enabled) return;
  const c = ac(); if (!c) return;
  const t0 = c.currentTime;

  const osc = c.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(760 * pitch, t0);
  osc.frequency.exponentialRampToValueAtTime(680 * pitch, t0 + dur * 0.25);
  osc.frequency.exponentialRampToValueAtTime(240 * pitch, t0 + dur);

  // Zittern: je tiefer der Ton wird, desto langsamer
  const trem = c.createOscillator();
  trem.type = 'square';
  trem.frequency.setValueAtTime(26, t0);
  trem.frequency.linearRampToValueAtTime(12, t0 + dur);
  const tremDepth = c.createGain();
  tremDepth.gain.value = gain * 0.75;

  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.06);
  g.gain.setValueAtTime(gain, t0 + dur * 0.6);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

  const lp = c.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(2600, t0);
  lp.frequency.exponentialRampToValueAtTime(900, t0 + dur);

  trem.connect(tremDepth).connect(g.gain);
  osc.connect(lp).connect(g).connect(master);

  osc.start(t0); trem.start(t0);
  osc.stop(t0 + dur + 0.05); trem.stop(t0 + dur + 0.05);

  // etwas Atemluft dazu
  noise({ dur: dur * 0.8, gain: gain * 0.35, filter: 1500, q: 0.7 });
}

/** Schnauben: kurzer Luftstoß durch die Nüstern. */
function snort() {
  if (!enabled) return;
  const c = ac(); if (!c) return;
  const n = noise({ dur: 0.3, gain: 0.13, filter: 420, type: 'lowpass', q: 0.8 });
  if (n) {
    // leichtes Flattern der Nüstern
    n.g.gain.setValueAtTime(0.13, n.t0);
    n.g.gain.setValueAtTime(0.05, n.t0 + 0.05);
    n.g.gain.setValueAtTime(0.14, n.t0 + 0.09);
    n.g.gain.setValueAtTime(0.06, n.t0 + 0.15);
    n.g.gain.exponentialRampToValueAtTime(0.001, n.t0 + 0.3);
  }
  tone({ freq: 150, dur: 0.22, type: 'sine', gain: 0.05, slide: -50 });
}

/** Ruhiges Ausatmen — das Geräusch eines zufriedenen Pferdes. */
function blow() {
  noise({ dur: 0.55, gain: 0.055, filter: 700, type: 'lowpass', q: 0.6 });
}

/** Kauen: mehrere kurze Mahlgeräusche hintereinander. */
function chew(times = 5) {
  for (let i = 0; i < times; i++) {
    noise({ dur: 0.09, gain: 0.06, filter: 700 + (i % 2) * 400, delay: i * 0.19 });
  }
}

/** Trinken: Schlucke mit absteigender Tonhöhe. */
function drink(times = 4) {
  for (let i = 0; i < times; i++) {
    const d = i * 0.28;
    noise({ dur: 0.13, gain: 0.05, filter: 900, delay: d });
    tone({ freq: 420 - i * 30, dur: 0.16, type: 'sine', gain: 0.045, slide: 180, delay: d + 0.02 });
  }
}

/** Huf stampft auf den Boden. */
function stomp() {
  noise({ dur: 0.12, gain: 0.13, filter: 220, type: 'lowpass' });
  tone({ freq: 90, dur: 0.16, type: 'sine', gain: 0.1, slide: -35 });
}

/* ---------------------------------------------------------------- Register */

const sfx = {
  /* Bedienung */
  click:  () => tone({ freq: 520, dur: .07, type: 'triangle', gain: .1 }),
  error:  () => tone({ freq: 200, dur: .18, type: 'square', gain: .1, slide: -60 }),
  buy:    () => { tone({ freq: 660, dur: .1, type: 'triangle', gain: .11 });
                  tone({ freq: 880, dur: .16, type: 'triangle', gain: .1, delay: .09 }); },
  coin:   () => { tone({ freq: 988, dur: .08, type: 'square', gain: .07 });
                  tone({ freq: 1319, dur: .12, type: 'square', gain: .06, delay: .06 }); },
  fanfare:() => [523, 659, 784, 1047].forEach((f, i) =>
                  tone({ freq: f, dur: .3, type: 'triangle', gain: .1, delay: i * .11 })),

  /* Parcours */
  jump:   () => { tone({ freq: 300, dur: .18, type: 'sine', gain: .12, slide: 260 }); stomp(); },
  land:   () => { noise({ dur: .09, gain: .09, filter: 320, type: 'lowpass' }); },
  hoof:   () => noise({ dur: .05, gain: .05, filter: 240, type: 'lowpass' }),
  crash:  () => { tone({ freq: 180, dur: .32, type: 'sawtooth', gain: .15, slide: -120 });
                  noise({ dur: .3, gain: .11, filter: 700 });
                  whinny({ pitch: 1.25, dur: .5, gain: .07 }); },

  /* Pflege */
  brush:  () => noise({ dur: .09, gain: .06, filter: 2400 }),
  straw:  () => noise({ dur: .14, gain: .08, filter: 3600 }),
  water:  () => tone({ freq: 640, dur: .2, type: 'sine', gain: .08, slide: 240 }),
  hammer: () => { tone({ freq: 1400, dur: .06, type: 'square', gain: .09 });
                  noise({ dur: .08, gain: .09, filter: 2000 }); },
  muck:   () => noise({ dur: .18, gain: .07, filter: 500, type: 'lowpass' }),

  /* Pferd */
  neigh:  () => whinny(),
  neighLong: () => whinny({ dur: 1.05, gain: .085 }),
  neighHigh: () => whinny({ pitch: 1.3, dur: .6 }),
  snort,
  blow,
  chew,
  drink,
  stomp,
  eat:    () => chew(5),
};

/** Ein zufälliger Stalllaut für die Hintergrundstimmung. */
function randomHorseSound() {
  const pool = [sfx.snort, sfx.blow, sfx.stomp, sfx.neigh, sfx.blow, sfx.snort];
  pool[Math.floor(Math.random() * pool.length)]();
}
Object.assign(__exports, { audioContext, isSoundOn, masterOut, randomHorseSound, setSound, sfx });
});

__def('js/music.js', function (__exports, __req) {
/* music.js — Hintergrundmusik.
 *
 * Die Stücke stehen als Notendaten im Code (Tonhöhe, Länge, Instrument) und
 * werden über die Web Audio API gespielt — im Grunde MIDI ohne Datei und ohne
 * Klangbibliothek. Dadurch bleibt das Spiel eine einzige, ladefreie Einheit.
 *
 * Aufbau eines Stücks:
 *   bpm     Tempo
 *   length  Länge der Schleife in Zählzeiten
 *   parts   [{ inst, gain, notes: [[Zählzeit, Note|Akkord, Dauer], …] }]
 */

const { audioContext } = __req('js/util/audio.js');

/* ---------------------------------------------------------------- Tonhöhen */

const SEMITONES = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };

function freq(note) {
  if (!note) return 0;
  const m = /^([A-G]#?)(-?\d)$/.exec(note);
  if (!m) return 0;
  const midi = (Number(m[2]) + 1) * 12 + SEMITONES[m[1]];
  return 440 * Math.pow(2, (midi - 69) / 12);
}

/** Dreiklang über einem Grundton: "C4" → ["C4","E4","G4"] (dur) bzw. moll. */
function chord(root, kind = 'maj') {
  const m = /^([A-G]#?)(-?\d)$/.exec(root);
  const base = SEMITONES[m[1]], oct = Number(m[2]);
  const steps = kind === 'min' ? [0, 3, 7] : kind === 'dom' ? [0, 4, 7, 10] : [0, 4, 7];
  const names = Object.keys(SEMITONES);
  return steps.map(s => {
    const v = base + s;
    return names.find(n => SEMITONES[n] === v % 12) + (oct + Math.floor(v / 12));
  });
}

/* ---------------------------------------------------------------- Stücke */

/** Ruhiger Walzer für den Stall — 3/4, langsam, warm. */
function stallTheme() {
  const bars = [
    ['C3', 'maj'], ['A2', 'min'], ['F2', 'maj'], ['G2', 'maj'],
    ['C3', 'maj'], ['E3', 'min'], ['F2', 'maj'], ['G2', 'dom'],
  ];
  const bass = [], pad = [];
  bars.forEach(([root, kind], i) => {
    const t = i * 3;
    bass.push([t, root, 1.0]);                       // "Oom"
    pad.push([t + 1, chord(root, kind), 0.8]);       // "pah"
    pad.push([t + 2, chord(root, kind), 0.8]);       // "pah"
  });

  const melody = [
    [0, 'G4', 1], [1, 'A4', 1], [2, 'B4', 1],
    [3, 'C5', 2], [5, 'A4', 1],
    [6, 'F4', 1], [7, 'G4', 1], [8, 'A4', 1],
    [9, 'G4', 2], [11, 'B4', 1],
    [12, 'C5', 1], [13, 'B4', 1], [14, 'A4', 1],
    [15, 'G4', 2], [17, 'E4', 1],
    [18, 'F4', 1], [19, 'A4', 1], [20, 'C5', 1],
    [21, 'B4', 2.4],
  ];

  return {
    bpm: 88, length: 24,
    parts: [
      { inst: 'bass', gain: 0.16, notes: bass },
      { inst: 'pad',  gain: 0.07, notes: pad },
      { inst: 'lead', gain: 0.11, notes: melody },
    ],
  };
}

/** Fröhliches Galopp-Stück für die Tagstrecken — 4/4, treibend. */
function rideTheme() {
  const bars = [['G2', 'maj'], ['E2', 'min'], ['C2', 'maj'], ['D2', 'dom']];
  const bass = [], pad = [], perc = [];

  bars.forEach(([root, kind], i) => {
    const t = i * 4;
    // Galopprhythmus: lang – kurz – kurz
    bass.push([t, root, 0.45], [t + 0.75, root, 0.2], [t + 1, root, 0.2]);
    bass.push([t + 2, root, 0.45], [t + 2.75, root, 0.2], [t + 3, root, 0.2]);
    pad.push([t + 1.5, chord(root, kind), 0.4], [t + 3.5, chord(root, kind), 0.4]);
    for (let b = 0; b < 4; b++) {
      perc.push([t + b, b % 2 === 0 ? 'kick' : 'hat', 0.2]);
      perc.push([t + b + 0.5, 'hat', 0.15]);
    }
  });

  const melody = [
    [0, 'G4', 1], [1, 'D5', 0.5], [1.5, 'E5', 0.5], [2, 'G5', 1], [3, 'A5', 1],
    [4, 'B5', 1.5], [5.5, 'A5', 0.5], [6, 'G5', 1], [7, 'E5', 1],
    [8, 'C5', 1], [9, 'E5', 0.5], [9.5, 'G5', 0.5], [10, 'A5', 1], [11, 'G5', 1],
    [12, 'F5', 1], [13, 'A5', 0.5], [13.5, 'F5', 0.5], [14, 'D5', 2],
  ];

  return {
    bpm: 138, length: 16,
    parts: [
      { inst: 'bass', gain: 0.15, notes: bass },
      { inst: 'pad',  gain: 0.05, notes: pad },
      { inst: 'lead', gain: 0.10, notes: melody },
      { inst: 'perc', gain: 0.09, notes: perc },
    ],
  };
}

/** Getragene Moll-Fassung für den Bergpfad bei Nacht. */
function nightTheme() {
  const bars = [['E2', 'min'], ['C2', 'maj'], ['A2', 'min'], ['B2', 'dom']];
  const bass = [], pad = [], perc = [];

  bars.forEach(([root, kind], i) => {
    const t = i * 4;
    bass.push([t, root, 0.9], [t + 1.5, root, 0.4], [t + 2, root, 0.9], [t + 3.5, root, 0.4]);
    pad.push([t + 0.5, chord(root, kind), 1.2], [t + 2.5, chord(root, kind), 1.2]);
    perc.push([t, 'kick', 0.2], [t + 2, 'kick', 0.2], [t + 1, 'hat', 0.15], [t + 3, 'hat', 0.15]);
  });

  const melody = [
    [0, 'B4', 1.5], [1.5, 'E5', 0.5], [2, 'G5', 1], [3, 'F#5', 1],
    [4, 'E5', 2], [6, 'D5', 1], [7, 'B4', 1],
    [8, 'C5', 1.5], [9.5, 'E5', 0.5], [10, 'A5', 1], [11, 'G5', 1],
    [12, 'F#5', 2], [14, 'E5', 2],
  ];

  return {
    bpm: 104, length: 16,
    parts: [
      { inst: 'bass', gain: 0.15, notes: bass },
      { inst: 'pad',  gain: 0.06, notes: pad },
      { inst: 'lead', gain: 0.10, notes: melody },
      { inst: 'perc', gain: 0.07, notes: perc },
    ],
  };
}

/** Kurze, warme Schleife für den Titelbildschirm. */
function titleTheme() {
  const t = stallTheme();
  return { ...t, bpm: 76 };
}

const TRACKS = {
  stall: stallTheme(),
  ride:  rideTheme(),
  night: nightTheme(),
  title: titleTheme(),
};

/* ---------------------------------------------------------------- Abspieler */

const LOOKAHEAD_MS = 25;      // wie oft der Zeitplaner läuft
const SCHEDULE_AHEAD = 0.18;  // wie weit im Voraus Noten geplant werden

let out = null;               // Lautstärkeregler für die Musik
let timer = 0;
let current = null;           // aktuelles Stück
let currentId = null;
let nextNoteTime = 0;
let beat = 0;
let enabled = true;
let noiseBuffer = null;

function ensureOut() {
  const c = audioContext();
  if (!c) return null;
  if (!out) {
    out = c.createGain();
    out.gain.value = 0;
    out.connect(c.destination);
  }
  return c;
}

function getNoise(c) {

__def('js/state.js', function (__exports, __req) {
/* state.js — zentraler Spielzustand, Speichern/Laden, Offline-Abbau */

const { makeHorse, decayNeeds, NEEDS } = __req('js/horse.js');
const { DECOR, comfortOf } = __req('js/catalog.js');

const SAVE_KEY = 'goldhuf.save';
const SAVE_VERSION = 1;

/** Wie viele Stunden Abwesenheit maximal angerechnet werden. */
const OFFLINE_CAP_HOURS = 8;

const state = {
  version: SAVE_VERSION,
  coins: 120,
  lastSeen: Date.now(),
  activeHorseId: null,
  stableSlots: 2,
  horses: [],
  inventory: { hay: 3, oats: 0, carrots: 1, straw: 2, lickstone: 0, horseshoes: 1 },
  equipment: [],
  levels: {},
  talisman: false,
  lastDailyBonus: 0,
  pasture: { grass: 100, horses: [] },   // Weide: Grasstand und wer draußen ist
  settings: { sound: true, music: true, fullscreen: true },
};

/* ---------------------------------------------------------------- Abo */

const listeners = new Set();
function onChange(fn) { listeners.add(fn); return () => listeners.delete(fn); }
function emit() { for (const fn of listeners) fn(state); }

/* ---------------------------------------------------------------- Speichern / Laden */

function save() {
  state.lastSeen = Date.now();
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
  } catch (e) {
    console.warn('Speichern fehlgeschlagen:', e);
  }
}

function hasSave() {
  try { return !!localStorage.getItem(SAVE_KEY); } catch { return false; }
}

function load() {
  let raw;
  try { raw = localStorage.getItem(SAVE_KEY); } catch { return false; }
  if (!raw) return false;

  let data;
  try { data = JSON.parse(raw); } catch { return false; }
  if (!data || typeof data !== 'object') return false;

  data = migrate(data);

  // Zusammenführen, damit neue Felder aus künftigen Versionen Standardwerte behalten
  Object.assign(state, {
    ...state,
    ...data,
    inventory: { ...state.inventory, ...(data.inventory || {}) },
    settings:  { ...state.settings,  ...(data.settings  || {}) },
  });

  // Pferde reparieren (fehlende Bedürfnisse ergänzen)
  state.horses = (state.horses || []).map(h => {
    const base = makeHorse({ id: h.id });
    return { ...base, ...h, needs: { ...base.needs, ...(h.needs || {}) }, decor: h.decor || [] };
  });

  // Früher war die Deko für alle Ställe gemeinsam. Damit niemand etwas verliert,
  // bekommt jeder Stall eine eigene Kopie der bisherigen Einrichtung.
  if (Array.isArray(data.decor) && data.decor.length) {
    for (const h of state.horses) {
      if (!h.decor.length) h.decor = data.decor.map(d => ({ ...d }));
    }
  }
  delete state.decor;

  // Früher lagen die Pferdeäpfel im Spielstand statt in der Box.
  if (Array.isArray(data.muck) && data.muck.length) {
    const active = getActiveHorse() || state.horses[0];
    if (active && !(active.muck || []).length) active.muck = data.muck.map(m => ({ ...m }));
  }
  delete state.muck;

  // Weide ergänzen, falls der Spielstand sie noch nicht kennt
  state.pasture = { grass: 100, horses: [], ...(data.pasture || {}) };
  state.pasture.horses = (state.pasture.horses || []).filter(id => state.horses.some(h => h.id === id));

  if (!state.horses.length) return false;
  if (!getActiveHorse()) state.activeHorseId = state.horses[0].id;

  lastOfflineHours = applyOfflineDecay();
  return true;
}

/** Wie lange der Stall beim letzten Laden unbeaufsichtigt war (Stunden). */
let lastOfflineHours = 0;
function getLastOfflineHours() { return lastOfflineHours; }

function migrate(data) {
  // Platz für spätere Formatänderungen: data.version prüfen und Felder umbauen.
  if (!data.version) data.version = SAVE_VERSION;
  return data;
}

function resetGame() {
  try { localStorage.removeItem(SAVE_KEY); } catch {}
  Object.assign(state, {
    version: SAVE_VERSION,
    coins: 120,
    lastSeen: Date.now(),
    activeHorseId: null,
    stableSlots: 2,
    horses: [],
    inventory: { hay: 3, oats: 0, carrots: 1, straw: 2, lickstone: 0, horseshoes: 1 },
    equipment: [],
    levels: {},
    talisman: false,
    lastDailyBonus: 0,
    pasture: { grass: 100, horses: [] },
    settings: { ...state.settings },
  });

/* ---------------------------------------------------------------- Zeitablauf */

/**
 * Rechnet die Abwesenheit an — gedeckelt, damit nach längerer Pause
 * kein völlig verwahrlostes Pferd im Stall steht.
 */
function applyOfflineDecay() {

  if (hours <= 0.01) return 0;

  // Auch in der Abwesenheit sind Pferdeäpfel gefallen — etwa alle 40 Minuten
  // einer; in den Boxen der ruhenden Pferde halb so oft.
  for (const h of state.horses) {
    if (isOnPasture(h)) continue;          // draußen fällt nichts in die Box
    const rate = h.id === state.activeHorseId ? 1.5 : 0.75;
    const dropped = Math.floor(hours * rate);
    for (let i = 0; i < dropped; i++) dropMuck(null, h);
  }
  tickPasture(hours * 60);

  state.lastSeen = Date.now();
  return hours;
}

/* ---------------------------------------------------------------- Pferdeäpfel */

/* Auch die Äpfel gehören zur einzelnen Box: Wer in Stall A aufräumt, findet in
   Stall B trotzdem noch, was dort liegt. */

/** Wie viele Haufen höchstens gleichzeitig in einer Box liegen. */
const MUCK_MAX = 7;
/** Wie stark ein Haufen die Sauberkeit drückt. */
const MUCK_DIRT = 7;

let muckSeq = 0;

function getMuck(horse = getActiveHorse()) {
  if (!horse) return [];
  if (!horse.muck) horse.muck = [];
  return horse.muck;
}

/** Einen Haufen fallen lassen (optional an einer bestimmten Stelle in %). */
function dropMuck(x = null, horse = getActiveHorse()) {
  if (!horse) return null;
  const list = getMuck(horse);
  if (list.length >= MUCK_MAX) return null;

  const pile = {
    id: 'm' + Date.now().toString(36) + (muckSeq++).toString(36),
    x: x == null ? 15 + Math.random() * 70 : Math.max(6, Math.min(94, x)),
    y: 4 + Math.random() * 26,          // Tiefe im Boden, in Pixeln
    size: 0.85 + Math.random() * 0.35,
  };
  list.push(pile);
  horse.needs.clean = Math.max(0, horse.needs.clean - MUCK_DIRT);
  return pile;
}

/** Einen Haufen wegräumen. Gibt zurück, ob es ihn gab. */
function removeMuck(id, horse = getActiveHorse()) {
  const list = getMuck(horse);
  const i = list.findIndex(m => m.id === id);
  if (i < 0) return false;
  list.splice(i, 1);
  return true;
}

function muckCount(horse = getActiveHorse()) { return getMuck(horse).length; }

/** Bedürfnisabbau für alle Pferde um `hours` Stunden.
 *  Jeder Stall zählt für sich: nur die Deko in der eigenen Box hilft. */
function tickNeeds(hours) {
  const stallMul = hasEquip('traenke') ? { water: 0.5 } : {};
  // Draußen wird das Fell schneller schmutzig und der Durst größer, dafür
  // verschmutzt die Box nicht, solange das Pferd nicht darin steht.
  const pastureMul = { clean: 0, coat: 1.4, water: 1.3 };

  for (const h of state.horses) {
    const outside = isOnPasture(h);
    decayNeeds(h, hours, {
      comfort: outside ? 0 : comfortOf(h.decor || []),
      active: h.id === state.activeHorseId,
      needMul: outside ? pastureMul : stallMul,
    });
  }
}

/* ---------------------------------------------------------------- Pferde */

function getActiveHorse() {
  return state.horses.find(h => h.id === state.activeHorseId) || null;
}

function setActiveHorse(id) {
  if (state.horses.some(h => h.id === id)) {
    state.activeHorseId = id;
    save(); emit();
  }
}

function addHorse(horse) {
  state.horses.push(horse);
  if (!state.activeHorseId) state.activeHorseId = horse.id;
  save(); emit();
  return horse;
}

function freeStableSlots() {
  return state.stableSlots - state.horses.length;
}

/* ---------------------------------------------------------------- Münzen & Inventar */

function addCoins(n) {
  state.coins = Math.max(0, Math.round(state.coins + n));
  save(); emit();
  return state.coins;
}

function canAfford(price) { return state.coins >= price; }

function spend(price) {
  if (!canAfford(price)) return false;
  state.coins -= price;
  save(); emit();
  return true;
}

function invCount(key) { return state.inventory[key] || 0; }

function addInv(key, n) {
  state.inventory[key] = Math.max(0, (state.inventory[key] || 0) + n);
  save(); emit();
}

function useInv(key, n = 1) {
  if (invCount(key) < n) return false;
  state.inventory[key] -= n;
  save(); emit();
  return true;
}

function hasEquip(id) { return state.equipment.includes(id); }

function addEquip(id) {
  if (!hasEquip(id)) state.equipment.push(id);
  save(); emit();
}

/* ---------------------------------------------------------------- Deko */

/* Jeder Stall wird einzeln eingerichtet: Die Deko hängt am Pferd, nicht am
   Spielstand. Wer einen zweiten Kronleuchter will, kauft ihn also noch einmal. */

/** Die Deko-Liste eines Stalls (standardmäßig die des aktiven Pferdes). */
function getDecor(horse = getActiveHorse()) {
  if (!horse) return [];
  if (!horse.decor) horse.decor = [];
  return horse.decor;
}

function hasDecor(id, horse = getActiveHorse()) {
  return getDecor(horse).some(d => d.id === id);
}

function addDecor(id, horse = getActiveHorse()) {
  const def = DECOR[id];
  if (!def || !horse || hasDecor(id, horse)) return;
  const list = getDecor(horse);

  // Ein Stück derselben Gruppe (z. B. Kronleuchter) ersetzt das vorherige —
  // die Position wird übernommen, damit nichts an eine neue Stelle springt.
  let pos = null;
  if (def.group) {
    const oldIdx = list.findIndex(d => DECOR[d.id]?.group === def.group);
    if (oldIdx >= 0) { pos = list[oldIdx]; list.splice(oldIdx, 1); }
  }
  list.push({
    id,
    x: pos?.x ?? def.defaultX ?? 50,
    y: pos?.y ?? def.defaultY ?? 50,
  });
  save(); emit();
}

function moveDecor(id, x, y, horse = getActiveHorse()) {
  const d = getDecor(horse).find(d => d.id === id);
  if (!d) return;
  d.x = x; d.y = y;
  save();
}

/** Komfortpunkte des Stalls — wirkt nur auf das Pferd, das darin steht. */
function comfort(horse = getActiveHorse()) {
  return comfortOf(getDecor(horse));
}

/* ---------------------------------------------------------------- Strecken */

function levelRecord(levelId) {
  return state.levels[levelId] || { bestTime: null, bestCoins: 0, runs: 0, finished: false };
}

function saveLevelRun(levelId, { time, coins, finished }) {
  const rec = { ...levelRecord(levelId) };
  const newTime  = finished && (rec.bestTime == null || time < rec.bestTime);
  const newCoins = coins > (rec.bestCoins || 0);

  rec.runs = (rec.runs || 0) + 1;
  if (finished) rec.finished = true;
  if (newTime)  rec.bestTime = time;
  if (newCoins) rec.bestCoins = coins;

  state.levels[levelId] = rec;
  save(); emit();
  return { newTime, newCoins };
}

/** Gesamtzahl je verdienter Münzen — Grundlage für die Freischaltung von Strecken. */
function totalEarned() {
  return state.coins + (state.spentTotal || 0);
}

function trackSpend(n) {
  state.spentTotal = (state.spentTotal || 0) + n;
}

/* ---------------------------------------------------------------- Weide */

/**
 * Die Weide ist ein gemeinsamer Vorrat: Gras wächst langsam nach und wird von
 * den Pferden abgefressen. Ist es alle, müssen sie zurück in den Stall.
 */
const PASTURE = {
  eatPerMin: 15,        // Gras, das ein Pferd je Minute frisst
  foodPerMin: 25,       // Sattheit, die es dabei gewinnt
  regrowPerMin: 3.5,    // Nachwachsen auf leerer Weide
  grazedRegrow: 0.25,   // …anteilig, solange Pferde darauf stehen
  lowWarning: 25,       // ab hier wird gewarnt
};

function isOnPasture(horse) {
  return !!horse && (state.pasture?.horses || []).includes(horse.id);
}

function pastureHorses() {
  return (state.pasture?.horses || [])
    .map(id => state.horses.find(h => h.id === id))
    .filter(Boolean);
}

function grassLevel() { return Math.round(state.pasture?.grass ?? 0); }

/** Ab so viel Gras lohnt sich der Weidegang überhaupt. */
const PASTURE_MIN_GRASS = 10;

function canGoOut() { return grassLevel() >= PASTURE_MIN_GRASS; }

function sendToPasture(id) {
  if (!canGoOut()) return false;
  if (!state.pasture.horses.includes(id) && state.horses.some(h => h.id === id)) {
    state.pasture.horses.push(id);
    save(); emit();
    return true;
  }
  return false;
}

function bringToStable(id) {
  const i = state.pasture.horses.indexOf(id);
  if (i < 0) return false;
  state.pasture.horses.splice(i, 1);
  save(); emit();
  return true;
}

/**
 * Weide um `minutes` Minuten weiterlaufen lassen.
 * Längere Zeiträume werden in Häppchen gerechnet, damit Abfressen und
 * Nachwachsen in der richtigen Reihenfolge passieren.
 * @returns {{eaten:number, returned:string[]}}
 */
function tickPasture(minutes) {
  if (!state.pasture) state.pasture = { grass: 100, horses: [] };
  if (minutes <= 0) return { eaten: 0, returned: [] };

  let eatenTotal = 0;
  let returned = [];

  let left = minutes;
  while (left > 0) {
    const dt = Math.min(10, left);
    left -= dt;

    const list = pastureHorses();
    let starved = false;

    if (list.length) {
      const want = PASTURE.eatPerMin * dt * list.length;
      const eaten = Math.min(state.pasture.grass, want);
      state.pasture.grass -= eaten;
      eatenTotal += eaten;

      // Was jedes Pferd davon abbekommt
      const per = (eaten / list.length) / PASTURE.eatPerMin * PASTURE.foodPerMin;
      for (const h of list) {
        h.needs.food = Math.min(100, h.needs.food + per);
      }

      // Reichte das Gras nicht für alle? Dann ist die Weide abgefressen.
      if (eaten < want - 0.001) starved = true;
    }

    // Erst zurückschicken, dann nachwachsen lassen — sonst wäre die Weide
    // nie leer und die Pferde blieben ewig draußen.
    if (starved) {
      returned = list.map(h => h.name);
      state.pasture.horses = [];
    }

    const factor = state.pasture.horses.length ? PASTURE.grazedRegrow : 1;
    state.pasture.grass = Math.min(100, state.pasture.grass + PASTURE.regrowPerMin * dt * factor);
  }

  return { eaten: eatenTotal, returned };
}

/* ---------------------------------------------------------------- Tränke und Raufe */

/** Vorrat in Tränke bzw. Raufe verändern (0–100). */
function addSupply(horse, key, amount) {
  const before = horse[key] ?? 0;
  horse[key] = Math.max(0, Math.min(100, before + amount));
  return horse[key] - before;
}

/* ---------------------------------------------------------------- Tagesbonus */
