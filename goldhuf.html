__def('js/care.js', function (__exports, __req) {
/* care.js — Pflege: Beschreibung der Aktionen und ihre Wirkung.
 *
 * Die Bedienung findet direkt in der Stallbox statt (siehe stableScene.js);
 * hier stehen nur die Daten und die Rechnerei: Was füllt wie viel auf, wann
 * gibt es Münzen, und wann ist eine Aktion überhaupt sinnvoll.
 */

const { toast } = __req('js/util/dom.js');
const { addCoins, invCount, save, emit, muckCount } = __req('js/state.js');
const { addNeed, NEEDS } = __req('js/horse.js');

/** Ab diesem Wert gilt ein Bedürfnis als erledigt — darüber gibt es keine Münzen mehr. */
const REWARD_THRESHOLD = 72;

/* ---------------------------------------------------------------- Aktionen */

/**
 * target: worauf geklickt/gezogen wird — 'horse', 'floor', 'muck', 'wall', 'hooves'
 * mode:   'click' (einmal antippen), 'drag' (streichen), 'sequence' (mehrere Punkte)
 */
const ACTIONS = {
  feed: {
    name: 'Füttern', icon: '🌾', need: 'food', target: 'horse', mode: 'click',
    hint: 'Futter aussuchen — auf {name} tippen füttert direkt, auf die Raufe füllt den Vorrat.',
    pick: true,                                   // braucht vorher eine Futterauswahl
  },
  water: {
    name: 'Tränken', icon: '💧', need: 'water', target: 'horse', mode: 'click',
    hint: 'Auf die Tränke tippen füllt sie auf — auf {name} getippt, geht es gleich trinken.',
  },
  muck: {
    name: 'Ausmisten', icon: '🔱', need: 'clean', target: 'muck', mode: 'click',
    hint: 'Tippe die Pferdeäpfel an, um sie wegzuräumen.',
  },
  bed: {
    name: 'Einstreuen', icon: '🟨', need: 'clean', item: 'straw', target: 'floor', mode: 'drag',
    hint: 'Ziehe über den Boden und verteile das Stroh.',
  },
  lick: {
    name: 'Leckstein', icon: '🧂', need: 'food', item: 'lickstone', target: 'wall', mode: 'click',
    hint: 'Tippe an die Wand, wo der Leckstein hängen soll.',
  },
  groom: {
    name: 'Striegeln', icon: '🪮', need: 'coat', target: 'horse', mode: 'drag',
    hint: 'Streiche in Kreisen über das Fell.',
  },
  brush: {
    name: 'Putzen', icon: '🧽', need: 'coat', target: 'horse', mode: 'drag',
    hint: 'Bürste Fell und Hufe von {name} sauber.',
  },
  shoe: {
    name: 'Hufeisen', icon: '🧲', need: 'hooves', item: 'horseshoes', target: 'hooves', mode: 'sequence',
    hint: 'Tippe nacheinander auf alle vier Hufe.',
  },
};

/** Die drei Futtersorten. */
const FOODS = {
  hay:     { name: 'Heu',    icon: '🌾', amount: 18, coins: 6 },
  oats:    { name: 'Hafer',  icon: '🥣', amount: 35, coins: 10 },
  carrots: { name: 'Möhre',  icon: '🥕', amount: 22, coins: 8, bonusCoat: 4 },
};

/* ---------------------------------------------------------------- Verfügbarkeit */

/**
 * Darf die Aktion gerade ausgeführt werden?
 * @returns {{ok:boolean, reason:string}}
 */
function checkAction(key, horse) {
  const a = ACTIONS[key];
  if (!a) return { ok: false, reason: 'Unbekannt' };

  if (key === 'feed' && Object.keys(FOODS).every(k => invCount(k) <= 0))
    return { ok: false, reason: 'Kein Futter im Vorrat — im Shop kaufen.' };

  if (a.item && invCount(a.item) <= 0)
    return { ok: false, reason: `Kein Vorrat: ${a.name}. Im Shop nachkaufen.` };

  switch (key) {
    case 'water':
      if (horse.needs.water > 96 && (horse.trough ?? 0) > 96)
        return { ok: false, reason: 'Tränke voll — und das Pferd hat keinen Durst.' };
      break;
    case 'feed':
      if (horse.needs.food > 96 && (horse.rack ?? 0) > 92)
        return { ok: false, reason: 'Raufe voll — und das Pferd ist satt.' };
      break;
    case 'muck':
      if (muckCount() === 0) return { ok: false, reason: 'Es liegt nichts herum.' };
      break;
    case 'bed':
      if (horse.needs.clean > 92) return { ok: false, reason: 'Die Einstreu ist frisch.' };
      if (muckCount() > 2) return { ok: false, reason: 'Erst die Pferdeäpfel wegräumen.' };
      break;
    case 'groom':
    case 'brush':
      if (horse.needs.coat > 96) return { ok: false, reason: 'Das Fell glänzt schon.' };
      break;
    case 'shoe':
      if (horse.needs.hooves > 90) return { ok: false, reason: 'Die Eisen sitzen noch gut.' };
      break;
    case 'lick':
      if (horse.lickStone > 0.6) return { ok: false, reason: 'Der Leckstein hängt schon.' };
      break;
  }
  return { ok: true, reason: ACTIONS[key].hint };
}

/* ---------------------------------------------------------------- Wirkung */

/** Münzen für eine Pflegeaktion — abhängig davon, wie nötig sie war. */
function rewardFor(before, gained, base) {
  if (before >= REWARD_THRESHOLD) return 0;
  const urgency = (REWARD_THRESHOLD - before) / REWARD_THRESHOLD;   // 0…1
  return Math.max(1, Math.round(base * (0.4 + 0.6 * urgency) * (gained / 100 + 0.5)));
}

function needName(key) { return NEEDS.find(n => n.key === key)?.name || key; }

/**
 * Bedürfnis auffüllen, Münzen gutschreiben, Meldung zeigen.
 * @returns {{gained:number, coins:number}}
 */
function applyCare(horse, needKey, amount, baseCoins, label, quiet = false) {
  const before = horse.needs[needKey];
  const gained = addNeed(horse, needKey, amount);
  const coins = rewardFor(before, gained, baseCoins);
  if (coins > 0) addCoins(coins);
  save(); emit();

  if (!quiet) {
    toast(coins > 0
      ? `${label} — +${Math.round(gained)} ${needName(needKey)}, 🪙 ${coins}`
      : `${label} — +${Math.round(gained)} ${needName(needKey)}`, 'good');
  }
  return { gained, coins };
}
Object.assign(__exports, { ACTIONS, FOODS, applyCare, checkAction, needName, rewardFor });
});

    actionTimer: 0,
    soundIn: rnd(...SOUND_EVERY),
    muckIn: rnd(...MUCK_EVERY),
    onArrive: null,
  };

  /* --- Pflege im Gange --- */

  let progress = null;   // { key, done, total, label }
  let bedFilled = new Set();
  let hoofDone = 0;

  /* ---------------------------------------------------------------- Zeichnen */

  function drawHorse() {
    horse = getActiveHorse();
    if (!horse) return;
    horseSvgWrap.innerHTML = horseSVG(horse);
    plate.textContent = horse.name;
    drawDirt();
  }

  /** Schmutzflecken passend zum Fellzustand. */
  function drawDirt() {
    dirtLayer.innerHTML = '';
    const spots = Math.min(8, Math.floor((100 - horse.needs.coat) / 11));
    const places = [
      [36, 52], [48, 62], [30, 66], [56, 48], [42, 44],
      [24, 58], [52, 70], [62, 56],
    ];
    for (let i = 0; i < spots; i++) {
      const [lx, ly] = places[i];
      dirtLayer.append(el('div', {
        class: 'dirt-spot',
        dataset: { life: '2' },
        style: {
          left: `${lx}%`, top: `${ly}%`,
          transform: `rotate(${(i * 37) % 60 - 30}deg) scale(${0.7 + (i % 3) * 0.25})`,
        },
      }));
    }
  }

  function drawMuck() {
    muckLayer.innerHTML = '';
    for (const m of getMuck(horse)) {
      muckLayer.append(el('div', {
        class: 'muck-pile',
        dataset: { muckId: m.id },
        title: 'Wegräumen',
        style: {
          left: `${m.x}%`,
          bottom: `${m.y}px`,
          transform: `scale(${m.size})`,
        },
      }, [
        el('span', { class: 'muck-ball b1' }),
        el('span', { class: 'muck-ball b2' }),
        el('span', { class: 'muck-ball b3' }),
      ]));
    }
    updateMuckHighlight();
  }

  function drawDecor() {
    propLayer.innerHTML = '';
    for (const d of getDecor(horse)) {
      const def = DECOR[d.id];
      if (!def) continue;
      const art = def.art ? decorArt(d.id) : null;
      propLayer.append(el('div', {
        class: `decor-item ${def.cls || ''} ${art ? 'drawn' : ''}`,
        html: art || undefined,
        text: art ? undefined : def.icon,
        title: `${def.name} · Komfort +${def.comfort}`,
        dataset: { decorId: d.id },
        style: art
          ? { left: `${d.x}%`, top: `${d.y}%`, width: `${def.w}px` }
          : { left: `${d.x}%`, top: `${d.y}%` },
      }));
    }
    if (horse.lickStone > 0.05) {
      // Trägt bewusst auch die Klasse decor-item: dadurch lässt er sich im
      // Deko-Modus genauso verschieben wie alles andere an der Wand.
      propLayer.append(el('div', {
        class: 'decor-item lickstone-item',
        title: 'Leckstein — im Deko-Modus verschiebbar',
        dataset: { decorId: LICK_ID },
        style: {
          left: `${horse.lickPos ?? 88}%`,
          top: `${horse.lickPosY ?? 46}%`,
          opacity: 0.55 + horse.lickStone * 0.45,
        },
      }, '🧂'));
    }
  }

  /** Alles auffrischen, was vom Zustand abhängt. */
  function update() {
    horse = getActiveHorse();
    if (!horse) return;

    bedding.style.setProperty('--bedding', (horse.needs.clean / 100).toFixed(2));
    updateProps();

    scene.classList.remove('lit-1', 'lit-2', 'lit-3');
    const tier = lightTier(getDecor(horse));
    if (tier) scene.classList.add(`lit-${tier}`);

    horseWrap.classList.toggle('sad', conditionLabel(condition(horse)).mood === 'sad');

    drawMuck();
    drawDecor();
    // Während gestriegelt oder geputzt wird, die Flecken NICHT neu zeichnen —
    // sonst käme der schon weggewischte Schmutz sofort zurück.
    if (!progress) drawDirt();
    layout();
  }

  /** Nur die Füllstände von Tränke und Raufe — läuft während des Trinkens laufend. */
  function updateProps() {
    troughWater.style.height = `${clamp(horse.trough ?? 0, 0, 100)}%`;
    rackHay.style.height = `${clamp(horse.rack ?? 0, 0, 100)}%`;
    trough.classList.toggle('empty', (horse.trough ?? 0) < 8);
    rack.classList.toggle('empty', (horse.rack ?? 0) < 8);
  }

  /* ---------------------------------------------------------------- Bewegung */

  function layout() {
    horseWrap.style.left = `${anim.x}%`;
    horseWrap.style.setProperty('--flip', anim.dir);
    plate.style.left = `${anim.x}%`;
    bubble.style.left = `${anim.x}%`;
  }

  function setBehaviour(b) {
    anim.behaviour = b;
    horseWrap.classList.toggle('walking', b === 'walk');
    horseWrap.classList.toggle('grazing', b === 'graze');
    horseWrap.classList.toggle('breathing', b === 'idle' || b === 'busy');
    horseWrap.classList.toggle('drinking', b === 'drink');
    horseWrap.classList.toggle('eating', b === 'eat');
  }

  /** Hat das Pferd Durst und ist etwas in der Tränke? */
  function wantsDrink() { return horse.needs.water < THIRSTY && (horse.trough ?? 0) > 8; }
  /** Hunger und Futter in der Raufe? */
  function wantsFood()  { return horse.needs.food  < HUNGRY  && (horse.rack   ?? 0) > 8; }

  function pickBehaviour() {
    // Grundbedürfnisse gehen vor: das Pferd geht von selbst zur Tränke
    // oder zur Raufe, wenn dort etwas drin ist.
    if (wantsDrink()) { goTo('drink'); return; }
    if (wantsFood())  { goTo('eat');   return; }

    const r = Math.random();
    if (r < 0.42) {
      // ein Stück laufen
      let target = rnd(X_MIN, X_MAX);
      if (Math.abs(target - anim.x) < 8) target = anim.x < 50 ? anim.x + 18 : anim.x - 18;
      anim.target = clamp(target, X_MIN, X_MAX);
      anim.dir = anim.target > anim.x ? 1 : -1;
      setBehaviour('walk');
      anim.timer = 12;                 // Sicherheitsnetz, falls das Ziel nie erreicht wird
    } else if (r < 0.72) {
      setBehaviour('graze');
      anim.timer = rnd(4, 8);
    } else {
      setBehaviour('idle');
      anim.timer = rnd(3, 7);
    }
  }

  /** Zur Tränke oder zur Raufe gehen und sich dort bedienen. */
  function goTo(what) {
    const x = what === 'drink' ? TROUGH_X : RACK_X;
    walkTo(x, () => {
      setBehaviour(what);
      anim.actionTimer = what === 'drink' ? 6 : 8;
      showBubble(what === 'drink' ? '💧 schlürf' : '🌾 mampf');
      if (what === 'drink') sfx.drink(4); else sfx.chew(6);
    });
  }

  /** Das Pferd zu einer Stelle laufen lassen und danach etwas tun. */
  function walkTo(x, then) {
    anim.target = clamp(x, X_MIN, X_MAX);
    anim.dir = anim.target > anim.x ? 1 : -1;
    anim.onArrive = then;
    setBehaviour('walk');
    anim.timer = 12;
  }

  let lastTick = performance.now();

  function tick(now) {
    if (destroyed) return;
    const dt = Math.min(0.1, (now - lastTick) / 1000);
    lastTick = now;

    if (isVisible()) step(dt);
    requestAnimationFrame(tick);
  }

  function isVisible() {
    return !document.hidden && scene.closest('.screen')?.classList.contains('active');
  }

  function step(dt) {
    /* Laufen */
    if (anim.behaviour === 'walk' && anim.target != null) {
      const dist = anim.target - anim.x;
      const move = WALK_SPEED * dt * Math.sign(dist);
      if (Math.abs(move) >= Math.abs(dist)) {
        anim.x = anim.target;
        anim.target = null;
        const cb = anim.onArrive;
        anim.onArrive = null;
        setBehaviour('idle');
        anim.timer = rnd(1.5, 3);
        if (cb) cb();
      } else {
        anim.x += move;
      }
      layout();
    }

    /* Trinken und Fressen: Vorrat wandert nach und nach ins Pferd */
    if (anim.behaviour === 'drink' || anim.behaviour === 'eat') {
      const drinking = anim.behaviour === 'drink';
      const supply = drinking ? 'trough' : 'rack';
      const need = drinking ? 'water' : 'food';
      const rate = (drinking ? DRINK_RATE : EAT_RATE) * dt;

      const take = Math.min(rate, horse[supply] ?? 0, 100 - horse.needs[need]);
      if (take > 0.001) {
        addSupply(horse, supply, -take);
        addNeed(horse, need, take);
        updateProps();
      }

      anim.actionTimer -= dt;
      const done = anim.actionTimer <= 0 || take <= 0.001;
      if (done) {
        save(); emit();
        hideBubble();
        setBehaviour('idle');
        anim.timer = rnd(2, 4);
        if (Math.random() < 0.7) sfx.blow();
        onChange();
      }
    }

    /* Verhalten wechseln */
    if (anim.behaviour !== 'busy' && anim.behaviour !== 'drink' && anim.behaviour !== 'eat') {
      anim.timer -= dt;
      if (anim.timer <= 0) pickBehaviour();
    }

    /* Stalllaute */
    anim.soundIn -= dt;
    if (anim.soundIn <= 0) {
      anim.soundIn = rnd(...SOUND_EVERY);
      randomHorseSound();
      if (Math.random() < 0.35) flickEars();
    }

    /* Pferdeäpfel */
    anim.muckIn -= dt;
    if (anim.muckIn <= 0) {
      anim.muckIn = rnd(...MUCK_EVERY);
      if (muckCount() < 7) dropApple();
    }
  }

  function flickEars() {
    horseWrap.classList.add('ear-flick');
    setTimeout(() => horseWrap.classList.remove('ear-flick'), 700);
  }

  /** Das Pferd lässt einen Haufen fallen — mit kleiner Animation und Ton. */
  function dropApple() {
    // etwas hinter dem Pferd, je nach Blickrichtung
    const x = clamp(anim.x - anim.dir * 9, 8, 92);
    const pile = dropMuck(x);
    if (!pile) return;

    save(); emit();
    drawMuck();

    const node = muckLayer.querySelector(`[data-muck-id="${pile.id}"]`);
    if (node) {
      node.classList.add('dropping');
      setTimeout(() => node.classList.remove('dropping'), 700);
    }
    sfx.blow();
    setTimeout(() => sfx.muck(), 250);
    onChange();
  }

  /* ---------------------------------------------------------------- Werkzeuge */

  function setTool(key, foodKey = null) {
    tool = key;
    food = foodKey;
    progress = null;
    bedFilled = new Set();
    hoofDone = 0;

    scene.classList.toggle('tool-active', !!key);
    scene.dataset.tool = key || '';
    hoofLayer.innerHTML = '';
    hideBubble();

    if (!key) {
      hintBar.classList.add('hidden');
      setBehaviour('idle');
      updateMuckHighlight();
      return;
    }

    const a = ACTIONS[key];
    let text = a.hint.replaceAll('{name}', horse.name);
    if (key === 'feed' && food) text = `${FOODS[food].name} ausgewählt — tippe jetzt auf ${horse.name}.`;

    hintBar.innerHTML = '';
    hintBar.append(
      el('span', { class: 'hint-icon', text: key === 'feed' && food ? FOODS[food].icon : a.icon }),
      el('span', { text }),
      el('button', { class: 'hint-cancel', title: 'Werkzeug weglegen', onclick: () => { sfx.click(); setTool(null); onChange(); } }, '✕'),
    );
    hintBar.classList.remove('hidden');

    if (key === 'shoe') startShoeing();
    updateMuckHighlight();
  }

  function updateMuckHighlight() {
    const on = tool === 'muck' || muckCount() > 0;
    muckLayer.classList.toggle('highlight', on);
  }

  /* --- Fortschrittsblase über dem Pferd --- */

  function showBubble(text) {
    bubble.textContent = text;
    bubble.classList.remove('hidden');
  }
  function hideBubble() { bubble.classList.add('hidden'); }

  /* ---------------------------------------------------------------- Aktionen */

  /** Futter geben: Kopf runter, kauen, Bedürfnis auffüllen. */
  function doFeed() {
    if (!food) { toast('Wähle zuerst eine Futtersorte.', 'bad'); return; }
    const f = FOODS[food];
    if (!useInv(food, 1)) { sfx.error(); toast(`Kein ${f.name} mehr im Vorrat.`, 'bad'); return; }

    setBehaviour('eat');
    showBubble(`${f.icon} lecker!`);
    sfx.chew(5);

    applyCare(horse, 'food', f.amount, f.coins, `${f.name} gefüttert`);
    if (f.bonusCoat) addNeed(horse, 'coat', f.bonusCoat);

    setTimeout(() => {
      if (destroyed) return;
      hideBubble();
      setBehaviour('idle');
      if (Math.random() < 0.6) sfx.blow();
      // Kein Futter mehr? Werkzeug weglegen.
      if (invCount(food) <= 0) { food = null; setTool(null); }
      onChange();
    }, 1400);

    onChange();
  }

  /** Tränke auffüllen. Auf das Pferd geklickt, geht es anschließend gleich trinken. */
  function fillTrough(alsoDrink) {
    const before = horse.needs.water;
    const added = addSupply(horse, 'trough', 100);

    if (added <= 0 && !alsoDrink) { toast('Die Tränke ist randvoll.'); return; }
    if (added <= 0 && horse.needs.water > 96) { toast('Voll — und satt getrunken.'); return; }

    sfx.water();
    const coins = rewardFor(before, Math.min(100 - before, Math.max(added, 40)), 5);
    if (coins) addCoins(coins);
    save(); emit();
    updateProps();
    toast(coins ? `Frisches Wasser — 🪙 ${coins}` : 'Frisches Wasser in der Tränke', 'good');

    if (alsoDrink && horse.needs.water < 99) goTo('drink');
    setTool(null);
    onChange();
  }

  /** Futter in die Raufe füllen — davon bedient sich das Pferd später selbst. */
  function fillRack() {
    if (!food) { toast('Wähle zuerst eine Futtersorte.', 'bad'); return; }
    const f = FOODS[food];
    if ((horse.rack ?? 0) > 92) { toast('Die Raufe ist voll.'); return; }
    if (!useInv(food, 1)) { sfx.error(); toast(`Kein ${f.name} mehr im Vorrat.`, 'bad'); return; }

    const before = horse.needs.food;
    const added = addSupply(horse, 'rack', f.amount * 1.6);
    sfx.straw();

    const coins = rewardFor(before, added, f.coins);
    if (coins) addCoins(coins);
    save(); emit();
    updateProps();
    toast(coins ? `${f.name} in die Raufe — 🪙 ${coins}` : `${f.name} in die Raufe gefüllt`, 'good');

    if (invCount(food) <= 0) { food = null; setTool(null); }
    onChange();
  }

  /** Leckstein an die Wand hängen. */
  function doLick(xPct, yPct) {
    if (!useInv('lickstone', 1)) { sfx.error(); toast('Kein Leckstein im Vorrat.', 'bad'); return; }
    horse.lickStone = 1;
    horse.lickPos = clamp(xPct, 6, 94);
    horse.lickPosY = clamp(yPct, 10, 70);
    sfx.buy();
    applyCare(horse, 'food', 12, 5, 'Leckstein aufgehängt');
    setTool(null);
    update();
    onChange();
  }

  /** Einen Pferdeapfel wegräumen. */
  function doMuck(node) {
    const id = node.dataset.muckId;
    if (!removeMuck(id)) return;

    node.classList.add('cleared');
    setTimeout(() => node.remove(), 260);
    sfx.muck();

    const before = horse.needs.clean;
    addNeed(horse, 'clean', MUCK_DIRT);
    // Kleine Belohnung, wenn es wirklich nötig war
    const coins = before < 70 ? 2 : 0;
    if (coins) addCoins(coins);
    save(); emit();

    if (muckCount() === 0) {
      toast('Die Box ist wieder sauber! 🧹', 'good');
      sfx.neighHigh();
      if (tool === 'muck') setTool(null);
    }
    updateMuckHighlight();
    onChange();
  }

  /** Beim Striegeln/Putzen: Flecken unter dem Zeiger wegwischen. */
  let lastBrushSound = 0;

  function doBrush(clientX, clientY) {
    const radius = hasEquip(tool === 'groom' ? 'gummistriegel' : 'kardaetsche') ? 46 : 34;
    const spots = [...dirtLayer.querySelectorAll('.dirt-spot:not([data-done])')];
    if (!spots.length) return;

    if (!progress) {
      progress = { key: tool, done: 0, total: dirtLayer.children.length };
    }

    for (const s of spots) {
      const r = s.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      if (Math.hypot(clientX - cx, clientY - cy) > radius) continue;

      const life = Number(s.dataset.life) - 1;
      s.dataset.life = String(life);
      s.style.opacity = String(Math.max(0, life / 2));

      if (life <= 0) {
        s.dataset.done = '1';
        progress.done++;
        const per = (tool === 'groom' ? 42 : 30) / progress.total;
        addNeed(horse, 'coat', per);
        if (tool === 'brush') addNeed(horse, 'hooves', 10 / progress.total);
        showBubble(`${ACTIONS[tool].icon} ${progress.done}/${progress.total}`);
        save(); emit();
        onChange();
      }

      if (performance.now() - lastBrushSound > 100) {
        sfx.brush();
        lastBrushSound = performance.now();
      }
    }

    if (progress.done >= progress.total) finishBrush();
  }

  function finishBrush() {
    const label = tool === 'groom' ? 'Fell gestriegelt' : 'Blitzblank geputzt';
    const coins = Math.max(3, Math.round((tool === 'groom' ? 12 : 10) * (progress.total / 8)));
    addCoins(coins);
    toast(`${label} — 🪙 ${coins}`, 'good');
    sfx.neigh();
    progress = null;
    hideBubble();
    setTool(null);
    drawDirt();
    save(); emit();
    onChange();
  }

  /** Einstreuen: Bahnen auf dem Boden füllen. */
  function doBedding(clientX) {
    if (!bedCells.children.length) buildBedCells();
    const r = bedCells.getBoundingClientRect();
    const idx = clamp(Math.floor(((clientX - r.left) / r.width) * BED_CELLS), 0, BED_CELLS - 1);
    if (bedFilled.has(idx)) return;

    bedFilled.add(idx);
    bedCells.children[idx].classList.add('filled');
    sfx.straw();
    showBubble(`🟨 ${bedFilled.size}/${BED_CELLS}`);

    if (bedFilled.size >= BED_CELLS) {
      if (!useInv('straw', 1)) { sfx.error(); return; }
      applyCare(horse, 'clean', 45, 10, 'Frisch eingestreut');
      bedFilled = new Set();
      bedCells.innerHTML = '';
      hideBubble();
      setTool(null);
      sfx.blow();
      update();
      onChange();
    }
  }

  function buildBedCells() {
    bedCells.innerHTML = '';
    for (let i = 0; i < BED_CELLS; i++) {
      bedCells.append(el('div', {
        class: 'bed-cell',
        style: { left: `${(i / BED_CELLS) * 100}%`, width: `${100 / BED_CELLS + 0.5}%` },
      }));
    }
  }

  /** Hufeisen: vier Marken am Pferd, die nacheinander angeklickt werden. */
  function startShoeing() {
    setBehaviour('busy');
    hoofDone = 0;
    hoofLayer.innerHTML = '';
    // Positionen der vier Hufe im SVG (Prozent der Pferdegrafik)
    const hooves = [
      { x: 31, y: 90, name: 'Hinten links' },
      { x: 38, y: 92, name: 'Hinten rechts' },
      { x: 63, y: 92, name: 'Vorne links' },
      { x: 69, y: 90, name: 'Vorne rechts' },
    ];
    hooves.forEach((h, i) => {
      hoofLayer.append(el('div', {
        class: 'hoof-marker',
        title: h.name,
        dataset: { hoof: String(i) },
        style: { left: `${h.x}%`, top: `${h.y}%` },
      }, '🔨'));
    });
    showBubble('🧲 0/4 Hufe');
  }

  function doShoe(node) {
    if (node.dataset.done) return;
    node.dataset.done = '1';
    node.classList.add('done');
    node.textContent = '✔';
    hoofDone++;
    sfx.hammer();
    setTimeout(() => sfx.hammer(), 130);
    showBubble(`🧲 ${hoofDone}/4 Hufe`);

    if (hoofDone >= 4) {
      if (!useInv('horseshoes', 1)) { sfx.error(); setTool(null); return; }
      applyCare(horse, 'hooves', 100, 15, 'Neue Hufeisen');
      sfx.neigh();
      setTimeout(() => {
        if (destroyed) return;
        hideBubble();
        hoofLayer.innerHTML = '';
        setBehaviour('idle');
        setTool(null);
        onChange();
      }, 600);
      onChange();
    }
  }

  /* ---------------------------------------------------------------- Eingabe */

  let dragging = false;

  scene.addEventListener('pointerdown', e => {
    const muckNode = e.target.closest('.muck-pile');
    const hoofNode = e.target.closest('.hoof-marker');
    const onHorse = !!e.target.closest('.box-horse');
    const onTrough = !!e.target.closest('.trough');
    const onRack = !!e.target.closest('.hayrack');
    const onFloor = !!e.target.closest('.box-floor');

    // Pferdeäpfel darf man immer wegräumen — auch ohne Werkzeug in der Hand
    if (muckNode) { doMuck(muckNode); return; }
    if (hoofNode && tool === 'shoe') { doShoe(hoofNode); return; }

    if (!tool) {
      // Ohne Werkzeug: das Pferd streicheln
      if (onHorse) {
        sfx.neigh();
        horseWrap.classList.add('petted');
        setTimeout(() => horseWrap.classList.remove('petted'), 1400);
        flickEars();
      }
      return;
    }

    const a = ACTIONS[tool];

    if (a.mode === 'click') {
      if (tool === 'feed' && onHorse) doFeed();
      else if (tool === 'feed' && onRack) fillRack();
      else if (tool === 'water' && onTrough) fillTrough(false);
      else if (tool === 'water' && onHorse) fillTrough(true);
      else if (tool === 'lick' && !onHorse && !onFloor && !onRack) {
        const r = scene.getBoundingClientRect();
        doLick(((e.clientX - r.left) / r.width) * 100, ((e.clientY - r.top) / r.height) * 100);
      }
      return;
    }

    if (a.mode === 'drag') {
      dragging = true;
      scene.setPointerCapture?.(e.pointerId);
      if (tool === 'bed' && onFloor) doBedding(e.clientX);
      if ((tool === 'groom' || tool === 'brush') && onHorse) {
        setBehaviour('busy');
        doBrush(e.clientX, e.clientY);
      }
    }
  });

  scene.addEventListener('pointermove', e => {
    if (!dragging || !tool) return;
    const a = ACTIONS[tool];
    if (a.mode !== 'drag') return;

    if (tool === 'bed') {
      const r = floor.getBoundingClientRect();
      if (e.clientY >= r.top - 20) doBedding(e.clientX);
    } else {
      doBrush(e.clientX, e.clientY);
    }
  });

  const endDrag = () => {
    if (!dragging) return;
    dragging = false;
    if (anim.behaviour === 'busy' && tool !== 'shoe') setBehaviour('idle');
  };
  scene.addEventListener('pointerup', endDrag);
  scene.addEventListener('pointercancel', endDrag);
  scene.addEventListener('pointerleave', endDrag);

  /* ---------------------------------------------------------------- Deko-Modus */

  let decorMode = false;
  let draggingDecor = null;

  function setDecorMode(on) {
    decorMode = on;
    scene.classList.toggle('decor-mode', on);
    if (on) setTool(null);
  }

  scene.addEventListener('pointerdown', e => {
    if (!decorMode) return;
    const item = e.target.closest('.decor-item');
    if (!item) return;
    draggingDecor = item;
    item.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  scene.addEventListener('pointermove', e => {

__def('js/pasture.js', function (__exports, __req) {
/* pasture.js — die Weide.
 *
 * Draußen fressen die Pferde Gras und werden von selbst satt. Das Gras ist
 * begrenzt: Ist es abgefressen, müssen alle zurück in den Stall, und die Weide
 * erholt sich mit der Zeit wieder.
 */

const { el, clamp, rnd, toast } = __req('js/util/dom.js');
const { sfx, randomHorseSound } = __req('js/util/audio.js');
const { state, isOnPasture, pastureHorses, grassLevel, sendToPasture, bringToStable, PASTURE, PASTURE_MIN_GRASS, canGoOut } = __req('js/state.js');
const { horseSVG, condition, conditionLabel, BREEDS } = __req('js/horse.js');

const X_MIN = 8, X_MAX = 88;
const WALK_SPEED = 4.5;              // Prozent der Weidenbreite je Sekunde
const SOUND_EVERY = [14, 32];

let nav = {};
let ui = null;

function initPasture(navigation) { nav = navigation; }

/* ---------------------------------------------------------------- Bildschirm */

function renderPasture(root) {
  const ids = (state.pasture?.horses || []).join(',');

  // Nur neu bauen, wenn sich die Besetzung geändert hat — sonst würden die
  // Pferde bei jedem Auffrischen an den Anfang zurückspringen.
  if (!ui || !root.contains(ui.wrap) || ui.ids !== ids) build(root, ids);
  else update();
}

function build(root, ids) {
  ui?.stop?.();
  root.innerHTML = '';

  const field = el('div', { class: 'pasture-field' });
  const grassLayer = el('div', { class: 'grass-layer' });
  const fence = el('div', { class: 'pasture-fence' });
  const emptyNote = el('div', { class: 'pasture-empty hidden' });
  field.append(grassLayer, fence, emptyNote);

  const bar = el('div', { class: 'grass-bar' }, el('div', { class: 'grass-fill' }));
  const barLabel = el('div', { class: 'grass-label' });

  const roster = el('div', { class: 'roster' });

  const wrap = el('div', { class: 'pasture-layout' }, [
    el('div', { class: 'pasture-head' }, [
      el('div', {}, [
        el('h2', { text: '🌿 Weide' }),
        el('p', { class: 'sub', text: 'Draußen fressen die Pferde Gras und werden von selbst satt.' }),
      ]),
      el('div', { class: 'grow' }),
      el('div', { class: 'grass-meter' }, [barLabel, bar]),
      el('button', { class: 'btn', onclick: () => nav.go('stable') }, '↩ Zum Stall'),
    ]),
    field,
    roster,
  ]);
  root.append(wrap);

  const horses = [];   // { horse, node, x, dir, behaviour, timer }

  ui = { wrap, field, grassLayer, emptyNote, bar, barLabel, roster, horses, ids, stop: null };

  buildGrass(grassLayer);
  placeHorses();
  update();
  startLoop();

/* ---------------------------------------------------------------- Gras */

function buildGrass(layer) {
  layer.innerHTML = '';
  // Grasbüschel in mehreren Reihen, damit die Fläche Tiefe bekommt
  for (let i = 0; i < 90; i++) {
    const row = i % 3;
    layer.append(el('span', {
      class: `tuft row-${row}`,
      style: {
        left: `${(i * 7.7) % 100}%`,
        bottom: `${4 + row * 12 + ((i * 13) % 9)}%`,
        transform: `scale(${0.7 + ((i * 17) % 10) / 14}) rotate(${((i * 29) % 20) - 10}deg)`,
      },
    }));
  }
}

/* ---------------------------------------------------------------- Pferde */

function placeHorses() {
  const list = pastureHorses();
  ui.horses = list.map((horse, i) => {
    const node = el('div', {
      class: 'box-horse pasture-horse breathing',
      title: `${horse.name} — klicken zum Streicheln`,
      html: horseSVG(horse),
      onclick: () => {
        sfx.neigh();
        node.classList.add('petted');
        setTimeout(() => node.classList.remove('petted'), 1400);
      },
    });
    ui.field.append(node);
    return {
      horse, node,
      x: 18 + (i * 21) % 60,
      dir: i % 2 ? -1 : 1,
      behaviour: 'graze',
      timer: rnd(2, 6),
      target: null,
      soundIn: rnd(...SOUND_EVERY),
    };
  });
  layoutHorses();
}

function layoutHorses() {
  for (const h of ui.horses) {
    h.node.style.left = `${h.x}%`;
    h.node.style.setProperty('--flip', h.dir);
    // Weiter hinten stehende Pferde etwas kleiner zeichnen
    h.node.style.setProperty('--depth', (0.9 + (h.x % 17) / 60).toFixed(2));
  }
}

function setBehaviour(h, b) {
  h.behaviour = b;
  h.node.classList.toggle('walking', b === 'walk');
  h.node.classList.toggle('grazing', b === 'graze');
  h.node.classList.toggle('breathing', b === 'idle');
}

/* ---------------------------------------------------------------- Schleife */

function startLoop() {
  let last = performance.now();
  let raf = 0;
  let running = true;

  const tick = now => {
    if (!running) return;
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isVisible()) step(dt);
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);

  ui.stop = () => { running = false; cancelAnimationFrame(raf); };
  ui.step = step;      // für Tests

function isVisible() {
  return !document.hidden && ui?.wrap.closest('.screen')?.classList.contains('active');
}

function step(dt) {
  const hasGrass = grassLevel() > 0;

  for (const h of ui.horses) {
    if (h.behaviour === 'walk' && h.target != null) {
      const dist = h.target - h.x;
      const move = WALK_SPEED * dt * Math.sign(dist);
      if (Math.abs(move) >= Math.abs(dist)) {
        h.x = h.target; h.target = null;
        setBehaviour(h, hasGrass ? 'graze' : 'idle');
        h.timer = rnd(4, 9);
      } else {
        h.x += move;
      }
      layoutHorses();
    }

    h.timer -= dt;
    if (h.timer <= 0) {
      // Ohne Gras wird nur noch herumgestanden und gewartet
      if (!hasGrass) { setBehaviour(h, 'idle'); h.timer = rnd(3, 6); }
      else if (Math.random() < 0.45) {
        h.target = clamp(rnd(X_MIN, X_MAX), X_MIN, X_MAX);
        h.dir = h.target > h.x ? 1 : -1;
        setBehaviour(h, 'walk');
        h.timer = 14;
      } else {
        setBehaviour(h, 'graze');
        h.timer = rnd(5, 11);
      }
    }

    h.soundIn -= dt;
    if (h.soundIn <= 0) { h.soundIn = rnd(...SOUND_EVERY); randomHorseSound(); }
  }
}

/* ---------------------------------------------------------------- Anzeige */

function update() {
  if (!ui) return;
  const g = grassLevel();

  ui.bar.querySelector('.grass-fill').style.width = `${g}%`;
  ui.bar.classList.toggle('low', g <= PASTURE.lowWarning);
  ui.barLabel.textContent = `Gras: ${g} %` + (g <= 0 ? ' — abgefressen' : g <= PASTURE.lowWarning ? ' — wird knapp' : '');

  // Die Fläche verfärbt sich und die Büschel werden kürzer
  ui.field.style.setProperty('--grass', (g / 100).toFixed(2));
  ui.grassLayer.classList.toggle('bare', g <= 0);

  const outside = pastureHorses();
  ui.emptyNote.classList.toggle('hidden', !(g <= 0));
  if (g <= 0) {
    ui.emptyNote.innerHTML = '';
    ui.emptyNote.append(
      el('div', { class: 'ov-box' }, [
        el('h3', { text: '🌾 Die Weide ist abgefressen' }),
        el('p', { text: 'Hier wächst gerade nichts mehr. Die Pferde sind zurück im Stall — '
                      + 'gib dem Gras etwas Zeit, dann können sie wieder heraus.' }),
        el('div', { class: 'ov-actions' }, [
          el('button', { class: 'btn btn-primary', onclick: () => nav.go('stable') }, '🏠 Zum Stall'),
        ]),
      ]),
    );
  }

  // Wenn niemand draußen ist, einen Hinweis zeigen
  ui.field.classList.toggle('nobody', outside.length === 0 && g > 0);

  buildRoster();
}

function buildRoster() {
  const g = grassLevel();

  const cards = state.horses.map(h => {
    const out = isOnPasture(h);
    const c = condition(h);
    const info = conditionLabel(c);
    const canGo = canGoOut();

    return el('div', { class: `roster-card ${out ? 'outside' : ''}` }, [
      el('div', { class: 'roster-art', html: horseSVG(h) }),
      el('div', { class: 'roster-info' }, [
        el('div', { class: 'roster-name' }, [
          h.name,
          out ? el('span', { class: 'badge owned', text: '🌿 draußen' }) : null,
        ]),
        el('div', { class: 'roster-sub', text: `${BREEDS[h.breed].name} · Futter ${Math.round(h.needs.food)} %` }),
        el('div', { class: `roster-sub ${info.cls}`, text: `Zustand ${c} %` }),
      ]),
      el('button', {
        class: `btn btn-sm ${out ? '' : 'btn-primary'}`,
        disabled: !out && !canGo,
        title: !out && !canGo ? `Erst muss wieder Gras nachwachsen (mindestens ${PASTURE_MIN_GRASS} %).` : '',
        onclick: () => {
          sfx.click();
          if (out) { bringToStable(h.id); toast(`${h.name} ist zurück im Stall.`, 'good'); }
          else { sendToPasture(h.id); sfx.neighHigh(); toast(`${h.name} darf auf die Weide.`, 'good'); }

__def('js/shop.js', function (__exports, __req) {
/* shop.js — Laden: Verbrauchsartikel, Ausrüstung, Deko, Stallausbau */

const { el, toast } = __req('js/util/dom.js');
const { sfx } = __req('js/util/audio.js');
const { CONSUMABLES, EQUIPMENT, DECOR, SPECIALS } = __req('js/catalog.js');
const { decorArt } = __req('js/decorArt.js');
const { state, canAfford, spend, addInv, addEquip, hasEquip, addDecor, hasDecor, trackSpend, invCount, comfort, getActiveHorse } = __req('js/state.js');

const TABS = [
  { id: 'care',  label: '🧺 Pflege' },
  { id: 'gear',  label: '🪮 Ausrüstung' },
  { id: 'decor', label: '🕯️ Stallausstattung' },
  { id: 'stall', label: '🚪 Stall & Besonderes' },
];

let activeTab = 'care';
let nav = {};

function initShop(navigation) { nav = navigation; }

function renderShop(root) {

    el('div', { class: 'page-head' }, [

        el('h2', { text: '🛒 Sattelkammer' }),
        el('p', { class: 'sub', text: 'Alles für Pflege, Komfort und den Stallausbau.' }),
      ]),
      el('div', { class: 'grow' }),
      el('button', { class: 'btn', onclick: () => nav.go('stable') }, '↩ Zurück in den Stall'),
    ]),

    )),

      list.append(itemCard({

        desc: `${it.desc}`,

          redraw();
        },
      }));

      const owned = hasEquip(key);
      list.append(itemCard({
        icon: it.icon,
        title: it.name,
        desc: it.desc,
        price: it.price,
        owned,
        badge: owned ? 'Im Besitz' : null,
        onBuy: () => {
          if (!buy(it.price)) return;
          addEquip(key);
          toast(`${it.name} gekauft`, 'good');
          redraw();
        },
      }));
    }
  }

  if (activeTab === 'decor') {
    const horse = getActiveHorse();

    list.append(el('div', {
      class: 'panel',
      style: { gridColumn: '1 / -1' },
    }, [
      el('h3', { text: `Du richtest ein: Stall von ${horse.name}` }),
      el('p', {
        text: `Komfort in dieser Box: ${comfort()} Punkte. Komfort verlangsamt, wie schnell `
            + 'die Bedürfnisse sinken (bis zu 40 % weniger) und bringt einen kleinen Münzbonus im Parcours.',
      }),
      el('p', {
        style: { margin: 0, fontStyle: 'italic' },
        text: 'Jeder Stall wird einzeln eingerichtet. Willst du dasselbe Stück in einer anderen '
            + 'Box, kaufst du es dort noch einmal — den Stall wechselst du oben links im Stallbildschirm.',
      }),
    ]));

    for (const [key, it] of Object.entries(DECOR)) {
      const owned = hasDecor(key);
      const replaces = it.group
        ? Object.entries(DECOR).find(([k, d]) => d.group === it.group && hasDecor(k) && k !== key)
        : null;

      // In wie vielen anderen Ställen steht das Stück schon?
      const elsewhere = state.horses.filter(h => h.id !== horse.id && (h.decor || []).some(d => d.id === key)).length;

      const notes = [`Komfort +${it.comfort}`];
      if (replaces) notes.push(`ersetzt „${replaces[1].name}"`);
      if (elsewhere) notes.push(`steht schon in ${elsewhere} weiteren Stall${elsewhere > 1 ? 'en' : ''}`);

      list.append(itemCard({
        icon: it.icon,
        art: it.art ? decorArt(key) : null,
        title: it.name,
        desc: it.desc,
        note: notes.join(' · '),

        badge: owned ? 'In dieser Box' : null,

          redraw();
        },
      }));

      title: slot.name,
      desc: slot.desc,

      price: slot.price,

        state.talisman = true;
        toast('Das Glückshufeisen hängt über der Tür', 'good');
        redraw();
      },
    }));

    list.append(itemCard({
      icon: '🐎',
      title: 'Neues Pferd',
      desc: 'Rasse, Fell, Mähne und Namen frei wählen. Preise ab 500 Münzen.',
      note: state.horses.length >= state.stableSlots
        ? 'Alle Boxen belegt — erst eine Box dazukaufen.'
        : `${state.stableSlots - state.horses.length} freie Box(en)`,
      price: null,
      buyLabel: 'Zum Pferdemarkt',
      disabled: state.horses.length >= state.stableSlots,
      onBuy: () => nav.go('editor', { mode: 'buy' }),
    }));
  }
}

/** Kauf abwickeln; gibt false zurück, wenn das Geld nicht reicht. */
function buy(price) {
  if (!canAfford(price)) { sfx.error(); toast('Dafür reichen die Münzen nicht.', 'bad'); return false; }
  spend(price);
  trackSpend(price);
  sfx.buy();
  return true;
}

/* ---------------------------------------------------------------- Karte */

function itemCard({ icon, art, title, desc, note, price, onBuy, owned, badge, buyLabel = 'Kaufen', disabled }) {
  const affordable = price == null || canAfford(price);
  const isDisabled = disabled || owned || !affordable;

  return el('div', { class: `card ${owned ? 'locked' : ''}` }, [
    art ? el('div', { class: 'card-art drawn', html: art }) : el('div', { class: 'card-art', text: icon }),
    el('div', { class: 'card-title' }, [title, badge ? el('span', { class: 'badge owned', text: badge }) : null]),
    el('div', { class: 'card-desc', text: desc }),
    note ? el('div', { class: 'card-desc', style: { fontStyle: 'italic' }, text: note }) : null,
    el('div', { class: 'card-foot' }, [
      price != null
        ? el('span', { class: `price ${affordable ? '' : 'cant'}` }, `🪙 ${price}`)
        : el('span', { class: 'price' }, ''),
      el('div', { class: 'grow' }),
      el('button', {
        class: `btn btn-sm ${isDisabled ? '' : 'btn-primary'}`,
        disabled: isDisabled,
        onclick: onBuy,
      }, owned ? 'Schon da' : buyLabel),
    ]),
  ]);
}
Object.assign(__exports, { initShop, renderShop });
});

__def('js/horses.js', function (__exports, __req) {
/* horses.js — Pferdeauswahl: alle Pferde im Stall, aktives wechseln, neues kaufen */

const { el, toast } = __req('js/util/dom.js');

    el('div', { class: 'stat-row' }, [ el('span', { text: 'Tempo' }),        el('span', { class: 'stars', text: stars(b.speed) }) ]),

function stars(n) { return '★'.repeat(n) + '☆'.repeat(5 - n); }

__def('js/editor.js', function (__exports, __req) {
/* editor.js — Pferd erstellen, kaufen und umgestalten */

const { el, toast, modal } = __req('js/util/dom.js');
const { sfx } = __req('js/util/audio.js');
const { state, canAfford, spend, addHorse, setActiveHorse, freeStableSlots, trackSpend, save, emit } = __req('js/state.js');
const { BREEDS, COATS, MANE_COLORS, MANE_STYLES, MARKINGS, makeHorse, horseSVG } = __req('js/horse.js');
const { stars } = __req('js/horses.js');

/** Umfärben eines vorhandenen Pferdes kostet etwas — Name und Mähne sind gratis. */
const RECOLOR_PRICE = 120;

let nav = {};
function initEditor(navigation) { nav = navigation; }

let draft = null;      // das Pferd, das gerade gebaut wird
let mode = 'first';    // 'first' | 'buy' | 'edit'
let editingId = null;
let originalCoat = null;

function renderEditor(root, params = {}) {
  mode = params.mode || 'first';

  if (mode === 'edit') {
    const h = state.horses.find(x => x.id === params.horseId);
    if (!h) { nav.go('horses'); return; }
    editingId = h.id;
    draft = { ...h };
    originalCoat = h.coat;
  } else if (!draft || params.fresh !== false) {
    editingId = null;
    originalCoat = null;
    draft = makeHorse({
      name: mode === 'first' ? 'Keks' : '',
      breed: 'shetland', coat: 'fuchs', maneColor: 'blond',
      maneStyle: 'offen', marking: 'blesse',
    });
  }

  draw(root);
}

/* ---------------------------------------------------------------- Aufbau */

function draw(root) {
  root.innerHTML = '';

  const preview = el('div', { class: 'editor-preview' });
  const options = el('div', {});

  const title =
    mode === 'edit'  ? '✏️ Pferd umgestalten' :
    mode === 'first' ? '🐴 Dein erstes Pferd'  : '🐎 Pferdemarkt';

  const subtitle =
    mode === 'edit'  ? 'Name und Mähne änderst du kostenlos. Ein neues Fell kostet Münzen, die Rasse bleibt.' :
    mode === 'first' ? 'Such dir dein Pony aus und gib ihm einen Namen. Es gehört dir geschenkt.' :
                       'Wähle eine Rasse und gestalte dein neues Pferd.';

  root.append(el('div', { class: 'page' }, [
    el('div', { class: 'page-head' }, [
      el('div', {}, [ el('h2', { text: title }), el('p', { class: 'sub', text: subtitle }) ]),
      el('div', { class: 'grow' }),
      mode !== 'first'
        ? el('button', { class: 'btn', onclick: () => nav.go(mode === 'edit' ? 'horses' : 'stable') }, '↩ Abbrechen')
        : null,
    ]),
    el('div', { class: 'editor-layout' }, [preview, options]),
  ]));

  refresh(preview, options, root);
}

function refresh(preview, options, root) {
  const rerender = () => refresh(preview, options, root);

  /* --- Vorschau --- */
  const b = BREEDS[draft.breed];
  preview.innerHTML = '';
  preview.append(
    el('div', { html: horseSVG(draft) }),
    el('div', { class: 'pv-name', text: draft.name || 'Namenlos' }),
    el('div', { class: 'pv-breed', text: `${b.name} · ${COATS[draft.coat].name}` }),
    el('div', { class: 'stat-row', style: { marginTop: '10px' } },
      [el('span', { text: 'Sprungkraft' }), el('span', { class: 'stars', text: stars(b.jump) })]),
    el('div', { class: 'stat-row' }, [el('span', { text: 'Tempo' }), el('span', { class: 'stars', text: stars(b.speed) })]),
    el('div', { class: 'stat-row' }, [el('span', { text: 'Genügsamkeit' }), el('span', { class: 'stars', text: stars(b.hardy) })]),
  );

  /* --- Optionen --- */
  options.innerHTML = '';

  // Rasse (beim Umgestalten gesperrt)
  if (mode !== 'edit') {
    options.append(group('Rasse', Object.entries(BREEDS).map(([key, br]) => {
      const affordable = canAfford(br.price) || mode === 'first';
      const allowed = mode === 'first' ? br.price === 0 : true;
      return chip({
        active: draft.breed === key,
        disabled: !allowed || !affordable,
        title: allowed
          ? `${br.desc} ${br.price ? `— ${br.price} Münzen` : '— geschenkt'}`
          : 'Für den Anfang bekommst du ein Shetlandpony geschenkt.',
        label: `${br.name}${br.price ? ` · 🪙 ${br.price}` : ' · gratis'}`,
        onClick: () => { draft.breed = key; sfx.click(); rerender(); },
      });
    })));
    options.append(el('p', { class: 'field-hint', text: BREEDS[draft.breed].desc }));
  } else {
    options.append(group('Rasse', [
      el('span', { class: 'chip', style: { opacity: .8 } }, `${b.name} (bleibt)`),
    ]));
  }

  // Fellfarbe
  const coatChanged = mode === 'edit' && draft.coat !== originalCoat;
  options.append(group(
    mode === 'edit' ? `Fellfarbe (Wechsel: 🪙 ${RECOLOR_PRICE})` : 'Fellfarbe',
    Object.entries(COATS).map(([key, c]) => chip({
      active: draft.coat === key,
      swatch: c.body,
      label: c.name,
      onClick: () => { draft.coat = key; sfx.click(); rerender(); },
    }))
  ));

  // Abzeichen
  options.append(group('Abzeichen', Object.entries(MARKINGS).map(([key, mk]) => chip({
    active: draft.marking === key,
    label: mk.name,
    onClick: () => { draft.marking = key; sfx.click(); rerender(); },
  }))));

  // Mähnenfarbe
  options.append(group('Mähne & Schweif — Farbe', Object.entries(MANE_COLORS).map(([key, mc]) => chip({
    active: draft.maneColor === key,
    swatch: mc.color,
    label: mc.name,
    onClick: () => { draft.maneColor = key; sfx.click(); rerender(); },
  }))));

  // Mähnenstil
  options.append(group('Mähnenstil', Object.entries(MANE_STYLES).map(([key, ms]) => chip({
    active: draft.maneStyle === key,
    label: ms.name,
    onClick: () => { draft.maneStyle = key; sfx.click(); rerender(); },
  }))));

  // Name
  const nameInput = el('input', {
    class: 'text-input',
    type: 'text',
    maxlength: '16',
    placeholder: 'z. B. Blitz',
    value: draft.name,
    oninput: e => {
      draft.name = e.target.value;
      preview.querySelector('.pv-name').textContent = draft.name || 'Namenlos';
      updateSaveButton();
    },
  });
  options.append(el('div', { class: 'opt-group' }, [
    el('label', { class: 'opt-label', text: 'Name' }),
    nameInput,
    el('p', { class: 'field-hint', text: 'Höchstens 16 Zeichen.' }),
  ]));

  /* --- Aktion --- */
  const price = mode === 'edit'
    ? (coatChanged ? RECOLOR_PRICE : 0)
    : (mode === 'first' ? 0 : BREEDS[draft.breed].price);

  const saveBtn = el('button', { class: 'btn btn-big btn-primary', onclick: commit });
  const priceNote = el('p', { class: 'field-hint' });

  options.append(el('div', { class: 'editor-actions' }, [saveBtn]), priceNote);

  function updateSaveButton() {
    const nameOk = draft.name.trim().length > 0;
    const money = canAfford(price);
    saveBtn.disabled = !nameOk || !money;
    saveBtn.textContent =
      mode === 'edit'
        ? (price ? `Änderungen übernehmen · 🪙 ${price}` : 'Änderungen übernehmen')
        : (price ? `${draft.name.trim() || 'Pferd'} kaufen · 🪙 ${price}` : `${draft.name.trim() || 'Pferd'} in den Stall holen`);

    priceNote.textContent =
      !nameOk ? 'Gib deinem Pferd noch einen Namen.'
      : !money ? `Dir fehlen ${price - state.coins} Münzen.`
      : '';
  }
  updateSaveButton();

  function commit() {
    const name = draft.name.trim().slice(0, 16);
    if (!name) return;
    if (price > 0) {
      if (!canAfford(price)) { sfx.error(); return; }
      spend(price); trackSpend(price);
    }

    if (mode === 'edit') {
      const h = state.horses.find(x => x.id === editingId);
      Object.assign(h, {
        name, coat: draft.coat, marking: draft.marking,
        maneColor: draft.maneColor, maneStyle: draft.maneStyle,
      });
      save(); emit();
      sfx.buy();
      toast(`${name} sieht jetzt anders aus.`, 'good');
      draft = null;
      nav.go('horses');
      return;
    }

    if (freeStableSlots() <= 0) {
      toast('Alle Boxen sind belegt.', 'bad');
      return;
    }

    const horse = makeHorse({ ...draft, name });
    addHorse(horse);
    setActiveHorse(horse.id);
    draft = null;
    sfx.fanfare();

    modal({
      title: `🎉 Willkommen, ${name}!`,
      body: el('div', { style: { textAlign: 'center' } }, [
        el('div', { html: horseSVG(horse), style: { maxWidth: '300px', margin: '0 auto' } }),
        el('p', { text: mode === 'first'
          ? 'Kümmere dich gut um dein Pony: füttern, tränken, misten, striegeln. Danach geht es auf den Parcours.'
          : `${name} steht jetzt in deinem Stall.` }),
      ]),
      actions: [{ label: 'In den Stall', class: 'btn-primary', onClick: () => nav.go('stable') }],
      dismissable: false,
    });
  }
}

/* ---------------------------------------------------------------- Bausteine */

function group(label, children) {
  return el('div', { class: 'opt-group' }, [
    el('label', { class: 'opt-label', text: label }),
    el('div', { class: 'opt-row' }, children),
  ]);
}

function chip({ active, disabled, label, swatch, onClick, title }) {
  return el('button', {
    class: `chip ${active ? 'active' : ''}`,
    disabled,
    title: title || label,
    onclick: onClick,
  }, [
    swatch ? el('span', { class: 'swatch', style: { background: swatch } }) : null,
    label,
  ]);
}
Object.assign(__exports, { initEditor, renderEditor });
});

};

/* ---------------------------------------------------------------- Baukasten */

class Builder {
  constructor() {
    this.x = 700;                 // etwas Anlauf vor dem ersten Hindernis
    this.obstacles = [];
    this.pickups = [];
    this.scenery = [];
  }
  run(px) { this.x += px; return this; }

  ob(type) {
    const def = OBSTACLES[type];
    this.obstacles.push({ x: this.x, type, w: def.w, h: def.h });
    this.x += def.w;
    return this;
  }

  /** Münzbogen über dem zuletzt gesetzten Hindernis — wer hoch springt, kassiert. */
  arcOverLast(count = 5, peak = 150) {
    const last = this.obstacles[this.obstacles.length - 1];
    if (!last) return this;
    const cx = last.x + last.w / 2;
    const span = 130;
    for (let i = 0; i < count; i++) {
      const t = count === 1 ? 0.5 : i / (count - 1);
      const dx = (t - 0.5) * 2 * span;
      const y = GROUND_Y - peak + Math.pow(t - 0.5, 2) * 4 * (peak - last.h - 42);
      this.pickups.push({ x: cx + dx, y, type: 'coin' });
    }
    return this;
  }

  /** Waagerechte Münzreihe ab der aktuellen Position. */
  line(count = 4, height = 90, spacing = 62) {
    for (let i = 0; i < count; i++) {
      this.pickups.push({ x: this.x + i * spacing, y: GROUND_Y - height, type: 'coin' });
    }
    this.x += count * spacing;
    return this;
  }

  carrot(height = 130) {
    this.pickups.push({ x: this.x, y: GROUND_Y - height, type: 'carrot' });
    this.x += 60;
    return this;
  }

  /** Kulisse im Hintergrund (Bäume, Zuschauer, Felsen …). */
  deco(kind, count = 1, spacing = 300) {
    for (let i = 0; i < count; i++) this.scenery.push({ x: this.x + i * spacing, kind });
    return this;
  }

  finish(pad = 700) {
    return {
      obstacles: this.obstacles,
      pickups: this.pickups,
      scenery: this.scenery,
      length: this.x + pad,
    };
  }
}

/** Themenfarben pro Strecke. */
const THEMES = {
  reitplatz:     { sky: ['#a8d8f0', '#dff0fa'], hill: '#8fbf6a', hill2: '#6f9e50', ground: '#c9a86a', groundDark: '#a8874c', night: false },

  root.innerHTML = '';

  const cards = LEVELS.map(lv => {

        el('h2', { text: '🏇 Wohin soll es gehen?' }),
        el('p', { class: 'sub', text: `Du reitest ${horse.name} (${BREEDS[horse.breed].name}).` }),
      ]),
      el('div', { class: 'grow' }),
      el('button', { class: 'btn', onclick: () => nav.go('stable') }, '↩ Zurück in den Stall'),
    ]),

    el('div', { class: 'panel', style: { marginBottom: '18px' } }, [
      el('div', { class: 'stat-row' }, [
        el('span', { text: 'Zustand des Pferdes' }),
        el('b', { text: `${stats.condition} % — ${info.label}` }),

      el('div', { class: 'stat-row' }, [
        el('span', { text: 'Münzbonus' }),
        el('b', { text: stats.coinBonus > 1 ? `×${stats.coinBonus} (ab 80 % Zustand)` : 'kein Bonus — pflege dein Pferd für ×1,5' }),
      ]),
      el('div', { class: 'stat-row' }, [
        el('span', { text: 'Sprungkraft / Tempo' }),
        el('b', { text: stats.condition < 50 ? 'gemindert durch schlechten Zustand' : 'voll' }),

        : null,
    ]),

    el('div', { class: 'grid' }, cards),
  ]));

/* ---------------------------------------------------------------- Ergebnis */

function renderResult(root, data) {
  root.innerHTML = '';

  // Belohnung genau einmal gutschreiben
  let records = { newTime: false, newCoins: false };
  if (!data.applied) {
    data.applied = true;
    addCoins(data.total);
    records = saveLevelRun(data.levelId, { time: data.time, coins: data.total, finished: true });
    if (records.newTime) addCoins(25);
    data.records = records;
  } else {
    records = data.records || records;
  }

  const line = (label, value, cls = '') =>
    el('div', { class: `result-line ${cls}` }, [el('span', { text: label }), el('span', {}, value)]);

  root.append(el('div', { class: 'page' }, [
    el('div', { class: 'result-wrap' }, [
      el('h2', { class: 'result-title', text: '🏁 Geschafft!' }),
      el('p', { style: { color: '#d8c3a4' }, text: `${data.horse.name} hat den ${data.levelName} gemeistert.` }),

      el('div', { class: 'result-lines' }, [

        data.multiplier > 1
          ? line('Bonus für gepflegtes Pferd', `×${data.multiplier.toFixed(2)}`)

        line('Gesamt', `🪙 ${data.total}`, 'total'),

      el('p', { class: 'sub', style: { color: '#cbb392' },
        text: `${data.horse.name} ist nach dem Ritt hungrig und verschwitzt — Zustand jetzt ${horseCondition(data.horse)} %.` }),

      el('div', { class: 'result-actions' }, [
        el('button', { class: 'btn btn-primary', onclick: () => nav.startRide(data.levelId) }, '↻ Nochmal'),
        el('button', { class: 'btn', onclick: () => nav.go('levels') }, '🗺️ Andere Strecke'),
        el('button', { class: 'btn', onclick: () => nav.go('stable') }, '🏠 Zum Stall'),
      ]),
    ]),
  ]));
}
Object.assign(__exports, { initSelect, renderLevels, renderResult });
});

/* render.js — alles, was im Parcours auf die Leinwand gemalt wird */

const { GROUND_Y, OBSTACLES } = __req('js/ride/levels.js');
const { COATS, MANE_COLORS, BREEDS } = __req('js/horse.js');

const VIEW_W = 960;
const VIEW_H = 540;

/* ---------------------------------------------------------------- Hintergrund */

function drawBackground(ctx, cam, theme, time) {
  // Himmel
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  sky.addColorStop(0, theme.sky[0]);
  sky.addColorStop(1, theme.sky[1]);

  ctx.fillStyle = theme.ground;
  ctx.fillRect(0, GROUND_Y, VIEW_W, VIEW_H - GROUND_Y);
  ctx.fillStyle = theme.groundDark;
  ctx.fillRect(0, GROUND_Y, VIEW_W, 7);

  ctx.beginPath();
  ctx.moveTo(0, VIEW_H);

    ctx.lineTo(x, y);

  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,.75)';
  const off = -(cam * 0.12) % 620;
  for (let i = -1; i < 3; i++) {

    puff(ctx, x + 46, 66, 30);

    puff(ctx, x + 338, 108, 26);

  ctx.beginPath(); ctx.arc(x - r * 0.8, y + 8, r * 0.6, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,.85)';
  const off = -(cam * 0.06) % 900;
  for (let i = 0; i < 60; i++) {

    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();

  player.ducking = keys.duck && player.onGround;

  /* Laufanimation und Hufgeräusch */
  const cadence = (speed / 260) * 11;
  player.phase += cadence * dt;
  if (player.onGround) {
    hoofTimer -= dt;
    if (hoofTimer <= 0) { sfx.hoof(); hoofTimer = 0.28 / (speed / 260); }
  }

  /* Staub */
  for (const p of dust) { p.x -= 60 * dt; p.y -= 18 * dt; p.life -= dt * 1.6; p.r += 12 * dt; }
  dust = dust.filter(p => p.life > 0);

  collectPickups();
  checkCollision();
  countCleared();

  if (!crashed && player.x >= level.length) return finishRun();

  updateHud();
}

/* ---------------------------------------------------------------- Kollision */

function hitbox() {
  const h = player.ducking ? DUCK_H : HORSE_H;
  return {
    left:   player.x - HORSE_W * 0.34,
    right:  player.x + HORSE_W * 0.42,
    top:    player.y - h,
    bottom: player.y,
  };
}

function checkCollision() {
  const box = hitbox();

  for (const o of level.obstacles) {
    if (o.x > player.x + 220) break;
    if (o.x + o.w < box.left - 60) continue;

    const def = OBSTACLES[o.type];
    const overlapX = box.right > o.x && box.left < o.x + o.w;
    if (!overlapX) continue;

    if (def.pit) {
      // Wassergraben: es zählt, wo die Hufe aufsetzen — nicht die ganze Pferdebreite.
      // Das macht den Absprungzeitpunkt deutlich gutmütiger.
      if (player.onGround && player.x > o.x - 10 && player.x < o.x + o.w + 10) return crash(o);
      continue;
    }

    if (def.duck) {
      // Torbogen: der Balken hängt zwischen barLow und barHigh über dem Boden
      const barBottom = GROUND_Y - def.barLow;
      const barTop = GROUND_Y - def.barHigh;
      if (box.top < barBottom && box.bottom > barTop) return crash(o);
      continue;
    }

    // Normales Hindernis: Kollision, wenn die Unterkante unter der Oberkante liegt
    const obTop = GROUND_Y - o.h;
    if (box.bottom > obTop + 6) return crash(o);
  }
}

function crash(obstacle) {
  if (crashed) return;
  crashed = true;
  running = false;
  cancelAnimationFrame(raf);
  sfx.crash();

  const def = OBSTACLES[obstacle.type];

  // Glückshufeisen rettet die Hälfte der Münzen
  let kept = 0;
  if (state.talisman && coins > 0) {
    kept = Math.floor(coins / 2);
    Promise.resolve(__req('js/state.js')).then(m => m.addCoins(kept));
  }

  draw(performance.now() / 1000);

  showOverlay(el('div', { class: 'ov-box' }, [
    el('h3', { text: '💥 Das war zu eng!' }),
    el('p', { text: `${horse.name} ist am Hindernis „${def.name}" hängengeblieben.` }),
    coins > 0
      ? (kept > 0
          ? el('p', {}, [
              el('span', { class: 'ov-lost', text: `${coins} Münzen verloren — ` }),
              el('span', { class: 'ov-saved', text: `🍀 ${kept} durch das Glückshufeisen gerettet.` }),
            ])
          : el('p', { class: 'ov-lost', text: `${coins} gesammelte Münzen sind weg.` }))
      : el('p', { class: 'field-hint', text: 'Noch keine Münzen verloren — gleich nochmal.' }),
    el('p', { class: 'field-hint', text: `Geschafft bis Meter ${Math.round(player.x / 40)} von ${Math.round(level.length / 40)}.` }),
    el('div', { class: 'ov-actions' }, [
      el('button', { class: 'btn btn-primary', onclick: restart }, '↻ Von vorn (Leertaste)'),
      el('button', { class: 'btn', onclick: quit }, 'Zum Stall'),
    ]),
  ]));

  // Leertaste startet direkt neu
  const onKey = e => {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      document.removeEventListener('keydown', onKey);
      restart();
    }
  };
  setTimeout(() => document.addEventListener('keydown', onKey), 220);
}

function restart() {
  hideOverlay();
  resetRun();
  countdown(3);
}

/* ---------------------------------------------------------------- Sammeln & Ziel */

function collectPickups() {
  const box = hitbox();
  const reach = 26;

  for (const p of level.pickups) {
    if (p.taken) continue;
    if (p.x < box.left - 40) continue;
    if (p.x > box.right + 200) break;

    const cx = clamp(p.x, box.left, box.right);
    const cy = clamp(p.y, box.top, box.bottom);
    if (Math.hypot(p.x - cx, p.y - cy) > reach) continue;

    p.taken = true;
    if (p.type === 'carrot') {
      coins += CARROT_VALUE;
      addNeed(horse, 'food', 6);
      sfx.coin(); sfx.coin();
      popup(`+${CARROT_VALUE} 🥕`, p);
    } else {
      coins += COIN_VALUE;
      sfx.coin();
    }
  }
}

/** Sauber übersprungene Hindernisse zählen (für den Zielbonus). */
function countCleared() {
  for (const o of level.obstacles) {
    if (o.passed) continue;
    if (o.x + o.w < player.x - HORSE_W * 0.34) { o.passed = true; cleared++; }
  }
}

function finishRun() {
  finished = true;
  running = false;
  cancelAnimationFrame(raf);
  sfx.fanfare();

  const clearBonus = cleared * CLEAR_BONUS;
  const raw = coins + clearBonus;
  const total = Math.round(raw * coinMul);

  applyRideCost(horse);

  nav.showResult({
    levelId: level.id,
    levelName: level.name,
    time: runTime,
    coins,
    clearBonus,
    cleared,
    multiplier: coinMul,
    total,
    horse,
  });
}

function quit() {
  running = false;
  cancelAnimationFrame(raf);
  hideOverlay();
  nav.go('stable');
}

/* ---------------------------------------------------------------- Anzeige */

function updateHud() {
  hud.coins.textContent = coins;
  const pct = clamp((player.x / level.length) * 100, 0, 100);
  hud.progress.style.width = `${pct}%`;
  hud.marker.style.left = `${pct}%`;

  const sp = (player.stamina / STAMINA_MAX) * 100;
  hud.stamina.style.width = `${sp}%`;
  hud.staminaBar.classList.toggle('empty', sp < 20);
}

function showOverlay(node) {
  hud.overlay.innerHTML = '';
  hud.overlay.append(node);
  hud.overlay.classList.remove('hidden');
}
function hideOverlay() {
  hud.overlay.classList.add('hidden');
  hud.overlay.innerHTML = '';
}

/** Kleine fliegende Zahl beim Einsammeln. */
function popup(text, p) {
  const cam = player.x - HORSE_X;
  const r = canvas.getBoundingClientRect();
  const sx = ((p.x - cam) / VIEW_W) * r.width;
  const sy = (p.y / VIEW_H) * r.height;
  const node = el('div', { class: 'coin-pop', text, style: { left: `${sx}px`, top: `${sy}px` } });
  $('#ride-hud').append(node);
  setTimeout(() => node.remove(), 750);
}

function spawnDust(n) {
  for (let i = 0; i < n; i++) {
    dust.push({
      x: player.x - 20 + Math.random() * 30,
      y: GROUND_Y - 4 - Math.random() * 8,
      r: 3 + Math.random() * 5,
      life: 0.5 + Math.random() * 0.4,
    });
  }
}

/* ---------------------------------------------------------------- Zeichnen */

function draw(time) {
  const cam = player.x - HORSE_X;
  const theme = level.theme;

  drawBackground(ctx, cam, theme, time);
  drawScenery(ctx, level.scenery, cam);

  for (const o of level.obstacles) drawObstacle(ctx, o, cam);
  drawFinish(ctx, level.length, cam);
  for (const p of level.pickups) drawPickup(ctx, p, cam, time);

  drawDust(ctx, dust, cam);

  // Schatten unter dem Pferd
  const airHeight = GROUND_Y - player.y;
  const shadowScale = clamp(1 - airHeight / 400, 0.35, 1);
  ctx.fillStyle = `rgba(0,0,0,${0.28 * shadowScale})`;
  ctx.beginPath();
  ctx.ellipse(HORSE_X, GROUND_Y + 4, 46 * shadowScale, 9 * shadowScale, 0, 0, Math.PI * 2);
  ctx.fill();

  drawHorse(ctx, HORSE_X, player.y, {
    phase: player.phase,
    airborne: !player.onGround,
    ducking: player.ducking,
    coat: horse.coat,
    mane: horse.maneColor,
    scale: stats.scale,
  });

  if (theme.night) drawNightMask(ctx, HORSE_X + 60, GROUND_Y - 80, 330);

  if (crashed) {
    ctx.fillStyle = 'rgba(180,40,30,.18)';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }
}

/* Einblick für Tests und zum Nachjustieren der Balance (siehe README). */
if (typeof window !== 'undefined') {

  };
}

  // nächsten Start weiter "gedrückt" gelten.
  keys.jump = keys.duck = keys.sprint = false;
